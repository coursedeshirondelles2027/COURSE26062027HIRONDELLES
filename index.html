  <title>Organisateur Événement Trail & Course à Pied</title>
  <!-- Tailwind CSS -->

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- SDK FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .draggable-item { cursor: grab; }
    .draggable-item:active { cursor: grabbing; }
    .drag-over { border: 2px dashed #6366f1 !important; background-color: #f0f3ff !important; }
    .dragging { opacity: 0.4; }
    #gpx-map { height: 450px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    /* Cache l'outline par défaut sur les inputs de tableaux */

</head>
<body class="h-full font-sans text-slate-800 bg-slate-100 flex flex-col antialiased">

  <!-- TOP HEADER BANNER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center shrink-0">
          <i class="fa-solid fa-person-running text-xl"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 id="event-title-display" class="text-xl font-bold text-slate-900 tracking-tight">Course des Hirondelles 2027</h1>
          </div>
          <p class="text-xs text-slate-500 flex flex-wrap items-center gap-3 mt-0.5">
            <span><i class="fa-regular fa-calendar text-emerald-600 mr-1"></i><span id="event-date-display">26 juin 2027</span></span>
            <span><i class="fa-solid fa-location-dot text-rose-500 mr-1"></i><span id="event-location-display">Saint-Pierre-d'Irube</span></span>
            <span class="bg-emerald-100 text-emerald-800 font-medium px-2 py-0.5 rounded-full text-[10px]" id="event-formats-display">10k, Relais, Marche</span>
          </p>
        </div>
      </div>

      <div class="flex items-center flex-wrap gap-2">
        <button onclick="saveData(true)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 transition shadow-sm">
          <i class="fa-solid fa-floppy-disk"></i> Enregistrer
        </button>

        <span id="save-indicator" class="text-[11px] text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-md flex items-center gap-1 font-medium">
          <i class="fa-solid fa-check"></i> Synchronisé
        </span>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="flex-1 flex overflow-hidden">

    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 shadow-sm">
      <div class="p-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Modules & Sections</span>
        <button onclick="addNewCustomSectionPrompt()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-2 py-1 rounded flex items-center gap-1 shadow-sm">
          <i class="fa-solid fa-plus text-[10px]"></i> Section
        </button>
      </div>

      <nav id="sidebar-sections-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto bg-slate-100 p-4 md:p-6" id="main-content-viewport">
    </main>

  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://hiron27-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const eventRef = db.ref('eventData');

    const defaultData = {
      config: {
        title: "Course des Hirondelles 2027",
        date: "26 juin 2027",
        location: "Saint-Pierre-d'Irube",
        formats: ["10 km Solo (2x5km)", "10 km Relais", "10 km Marche"],
      },
      contacts: [
        { id: "c1", name: "Jean-Louis", role: "Responsable Administratif / Mairie", phone: "", email: "", org: "Club Athlé", notes: "" },
        { id: "c2", name: "Jérôme", role: "Référent Groupe Route", phone: "", email: "", org: "Ainarak", notes: "" }
      ],
      sections: [
        {
          id: "sec-0",
          title: "Planning Jour J (Agenda)",
          icon: "fa-calendar-check",
          type: "agenda",
          timeline: [
            { id: "t1", time: "06:30", activity: "Arrivée équipe logistique", location: "", resp: "c1", status: "Confirmé" }
          ],
          stickyNotes: [{ id: "sn1", title: "Micro & Musique", content: "Sonorisation de 7h00 à 13h00." }]
        },
        {
          id: "sec-1",
          title: "1. Course & Tracé",
          icon: "fa-map-location-dot",
          type: "trace_admin",
          gpxTrack: null,
          tasks: [{ id: "k1", name: "Création du tracé", resp: "c1", date: "2027-02-15", status: "Validé", notes: "" }]
        },
        {
          id: "sec-8",
          title: "8. Recherche de Lots & Sponsoring",
          icon: "fa-handshake",
          type: "standard",
          sheets: [{ id: "sh_base", url: "https://docs.google.com/spreadsheets/d/19ApJAATjuMhG_IWp9Dj8Ugdq8-4F31lt4wy5wZjsVso/edit", title: "Suivi des Dons et Sponsoring" }],
          tasks: [{ id: "k19", name: "Démarchage sponsors financiers", resp: "c2", date: "2027-03-01", status: "En cours", notes: "" }]
        },
        {
          id: "sec-contacts",
          title: "Répertoire Global des Contacts",
          icon: "fa-address-book",
          type: "contacts",
          stickyNotes: []
        }
      ]
    };

    let appData = null;
    let activeSectionId = null;
    let leafletMap = null;
    let leafletPolyline = null;

    function initAppData() {
      eventRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          appData = sanitizeData(data);
        } else {
          appData = defaultData;
          eventRef.set(appData);
        }
        
        if (!activeSectionId && appData.sections.length > 0) {
          activeSectionId = appData.sections[0].id;
        }

        renderHeader();
        renderSidebar();
        renderActiveSection();
      });
    }

    // Sécurisation et standardisation
    function sanitizeData(data) {
      if (!data.sections) data.sections = [];
      if (!Array.isArray(data.sections)) data.sections = Object.values(data.sections);

      data.sections.forEach(sec => {
        if (sec.title && (sec.title.toLowerCase().includes('bénévole') || sec.title.toLowerCase().includes('répertoire global'))) {
          sec.type = 'contacts';
        }

        if (sec.sheetUrl) {
          if (!sec.sheets) sec.sheets = [];
          sec.sheets.push({ id: 'sh_migrated_' + Date.now(), url: sec.sheetUrl, title: "Ancien Fichier Google Sheets" });
          delete sec.sheetUrl;
        }

        if (!sec.tables) sec.tables = []; else sec.tables = Object.values(sec.tables);
        if (!sec.tasks) sec.tasks = []; else sec.tasks = Object.values(sec.tasks);
        if (!sec.stickyNotes) sec.stickyNotes = []; else sec.stickyNotes = Object.values(sec.stickyNotes);
        if (!sec.timeline) sec.timeline = []; else sec.timeline = Object.values(sec.timeline);
        if (!sec.sheets) sec.sheets = []; else sec.sheets = Object.values(sec.sheets);
        
        sec.sheets.forEach(sh => {
          if (sh.title === undefined) sh.title = "Fichier Google Sheets";
        });

        if (!sec.localContacts) sec.localContacts = []; else sec.localContacts = Object.values(sec.localContacts);
        if (!sec.images) sec.images = []; else sec.images = Object.values(sec.images);
        if (!sec.attachments) sec.attachments = []; else sec.attachments = Object.values(sec.attachments);
      });

      if (!data.contacts) data.contacts = [];
      if (!Array.isArray(data.contacts)) data.contacts = Object.values(data.contacts);

      return data;
    }

    function saveData(explicitNotification = false) {
      if (!appData) return;
      eventRef.set(appData).then(() => {
        const ind = document.getElementById('save-indicator');
        if (ind) ind.innerHTML = '<i class="fa-solid fa-check"></i> Synchronisé';
        if (explicitNotification) alert("Données enregistrées.");
      });
    }

    function renderHeader() {
      document.getElementById('event-title-display').innerText = appData.config.title || "";
      document.getElementById('event-date-display').innerText = appData.config.date || "";
      document.getElementById('event-location-display').innerText = appData.config.location || "";
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-sections-list');
      container.innerHTML = '';

      appData.sections.forEach((sec) => {
        const isActive = sec.id === activeSectionId;
        const item = document.createElement('div');
        item.className = `flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium cursor-pointer ${
          isActive ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'
        }`;
        
        item.onclick = () => {
          activeSectionId = sec.id;
          renderSidebar();
          renderActiveSection();
        };

        item.innerHTML = `<div class="flex items-center space-x-2"><i class="fa-solid ${sec.icon || 'fa-folder'} text-xs"></i><span>${sec.title}</span></div>`;
        container.appendChild(item);
      });
    }

    function renderActiveSection() {
      const container = document.getElementById('main-content-viewport');
      const sec = appData.sections.find(s => s.id === activeSectionId);
      if (!sec) return;

      container.innerHTML = '';

      const headerBox = document.createElement('div');
      headerBox.className = 'bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col gap-4';
      
      headerBox.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-slate-900 flex items-center gap-3">
            ${sec.title}
            <button onclick="renameSection('${sec.id}')" class="text-slate-300 hover:text-emerald-600 transition" title="Renommer"><i class="fa-solid fa-pen text-sm"></i></button>
            <button onclick="deleteSection('${sec.id}')" class="text-slate-300 hover:text-rose-600 transition" title="Supprimer"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </h2>
        </div>
        
        <!-- BARRE D'OUTILS D'AJOUT DE MODULES -->
        <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-100">
          <span class="text-[10px] font-bold uppercase text-slate-400 mr-2 tracking-wider"><i class="fa-solid fa-toolbox"></i> Ajouter au tableau :</span>
          
          <button onclick="addNewTask('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition">
            <i class="fa-solid fa-list-check"></i> Tâche
          </button>
          
          <button onclick="addStickyNote('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-amber-50 hover:text-amber-700 hover:border-amber-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition">
            <i class="fa-solid fa-note-sticky"></i> Note
          </button>
          
          <button onclick="addLocalContact('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition">
            <i class="fa-solid fa-user-plus"></i> Contact
          </button>

          <button onclick="addNativeTable('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-green-50 hover:text-green-700 hover:border-green-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition">
            <i class="fa-solid fa-table"></i> Tableau Intégré
          </button>

          <label class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition cursor-pointer">
            <i class="fa-solid fa-image"></i> Image
            <input type="file" accept="image/*" onchange="uploadImage(event, '${sec.id}')" class="hidden">
          </label>

          <label class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-purple-50 hover:text-purple-700 hover:border-purple-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition cursor-pointer">
            <i class="fa-solid fa-paperclip"></i> Pièce Jointe
            <input type="file" onchange="uploadAttachment(event, '${sec.id}')" class="hidden">
          </label>

          <button onclick="addAgendaSlot('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition">
            <i class="fa-solid fa-clock"></i> Planning
          </button>
        </div>
      `;
      container.appendChild(headerBox);

      // RENDU DYNAMIQUE
      if (sec.type === 'trace_admin') renderMapModule(container, sec);
      if (sec.type === 'contacts') renderGlobalContactsModule(container);

      if (sec.tables && sec.tables.length > 0) renderTablesModule(container, sec);
      if (sec.sheets && sec.sheets.length > 0) renderSheetsModule(container, sec);
      if (sec.timeline && sec.timeline.length > 0) renderAgendaModule(container, sec);
      if (sec.tasks && sec.tasks.length > 0) renderTasksList(container, sec);
      if (sec.localContacts && sec.localContacts.length > 0) renderLocalContactsModule(container, sec);
      if (sec.images && sec.images.length > 0) renderImagesModule(container, sec);
      if (sec.attachments && sec.attachments.length > 0) renderAttachmentsModule(container, sec);
      if (sec.stickyNotes && sec.stickyNotes.length > 0) renderStickyNotesModule(container, sec);
    }

    // --- FONCTIONS SECTION ---
    function renameSection(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      const newTitle = prompt("Nouveau nom de la section :", sec.title);
      if (newTitle && newTitle.trim() !== "") {
        sec.title = newTitle.trim();
        saveData();
        renderSidebar();
        renderActiveSection();
      }
    }

    function deleteSection(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      if (confirm(`Es-tu sûr de vouloir supprimer la section "${sec.title}" et tout son contenu ?`)) {
        appData.sections = appData.sections.filter(s => s.id !== secId);
        activeSectionId = appData.sections.length > 0 ? appData.sections[0].id : null;
        saveData();
        renderSidebar();
        if (activeSectionId) renderActiveSection(); else document.getElementById('main-content-viewport').innerHTML = '';
      }
    }


    // --- MODULE CARTE GPX (RESTAURÉ) ---
    function handleGPXUpload(event, secId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const sec = appData.sections.find(s => s.id === secId);
        if (sec) {
          sec.gpxTrack = e.target.result;
          saveData();
          displayParsedGPX(e.target.result);
        }
      };
      reader.readAsText(file);
    }

    function parseGPXText(gpxXmlText) {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(gpxXmlText, "text/xml");
        const points = [];
        const elements = xmlDoc.querySelectorAll("trkpt, wpt, rtept");
        elements.forEach(pt => {
          const lat = parseFloat(pt.getAttribute("lat"));
          const lon = parseFloat(pt.getAttribute("lon"));
          const eleNode = pt.querySelector("ele");
          const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
          if (!isNaN(lat) && !isNaN(lon)) { points.push({ lat, lon, ele }); }
        });
        return points;
      } catch(err) { return []; }
    }

    function calculateHaversineDistance(p1, p2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (p2.lat - p1.lat) * rad;
      const dLon = (p2.lon - p1.lon) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(p1.lat * rad) * Math.cos(p2.lat * rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function calculateGPXStats(points) {
      if (!points || points.length < 2) return { distanceKm: 0, eleGain: 0 };
      let totalDist = 0, totalGain = 0;
      for (let i = 1; i < points.length; i++) {
        totalDist += calculateHaversineDistance(points[i-1], points[i]);
        const eleDiff = points[i].ele - points[i-1].ele;
        if (eleDiff > 0.5) totalGain += eleDiff;
      }
      return { distanceKm: (totalDist / 1000).toFixed(2), eleGain: Math.round(totalGain) };
    }

    function displayParsedGPX(gpxXmlText) {
      const points = parseGPXText(gpxXmlText);
      if (!points || points.length === 0) return;
      const latLngs = points.map(p => [p.lat, p.lon]);

      if (leafletMap) {
        if (leafletPolyline) leafletMap.removeLayer(leafletPolyline);
        leafletPolyline = L.polyline(latLngs, { color: '#16a34a', weight: 5, opacity: 0.9, lineJoin: 'round' }).addTo(leafletMap);
        leafletMap.fitBounds(leafletPolyline.getBounds(), { padding: [30, 30] });
        leafletMap.invalidateSize();
      }

      const stats = calculateGPXStats(points);
      
      const distEl = document.getElementById('gpx-dist-val');
      const eleEl = document.getElementById('gpx-ele-val');
      const ptsEl = document.getElementById('gpx-pts-val');
      const statEl = document.getElementById('gpx-status-val');

      if(distEl) distEl.innerText = `${stats.distanceKm} km`;
      if(eleEl) eleEl.innerText = `+${stats.eleGain} m`;
      if(ptsEl) ptsEl.innerText = points.length;
      if(statEl) {
          statEl.innerText = "Tracé Chargé";
          statEl.className = "text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full inline-block mt-0.5";
      }
    }

    function renderMapModule(container, sec) {
      const mapCard = document.createElement('div');
      mapCard.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6 space-y-4';
      mapCard.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3">
          <div>
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
              <i class="fa-solid fa-map text-emerald-600"></i> Carte Interactive & Visualiseur GPX
            </h3>
            <p class="text-xs text-slate-500">Choisissez la vue Satellite ou Plan en haut à droite.</p>
          </div>
          <div class="flex items-center gap-2">
            <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1.5 shadow-sm transition">
              <i class="fa-solid fa-file-code"></i> Charger Fichier GPX
              <input type="file" onchange="handleGPXUpload(event, '${sec.id}')" accept=".gpx" class="hidden">
            </label>
          </div>
        </div>

        <div id="gpx-stats-bar" class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 text-center text-xs">
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Distance</span><span id="gpx-dist-val" class="text-base font-extrabold text-emerald-700">-- km</span></div>
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Dénivelé (D+)</span><span id="gpx-ele-val" class="text-base font-extrabold text-indigo-700">-- m</span></div>
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Points</span><span id="gpx-pts-val" class="text-base font-bold text-slate-700">--</span></div>
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Statut</span><span id="gpx-status-val" class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full inline-block mt-0.5">En attente</span></div>
        </div>

        <div id="gpx-map"></div>
      `;
      container.appendChild(mapCard);

      setTimeout(() => {
        try {
          if (leafletMap) { leafletMap.remove(); }
          
          leafletMap = L.map('gpx-map').setView([43.4633, -1.4519], 13);

          const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
          });

          const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri'
          });

          osmStandard.addTo(leafletMap);

          L.control.layers({
            "🗺️ Plan (OpenStreetMap)": osmStandard,
            "🛰️ Satellite (Esri)": esriSatellite
          }, null, { position: 'topright' }).addTo(leafletMap);

          leafletMap.invalidateSize();

          // LOAD SAVED GPX
          if (sec.gpxTrack) displayParsedGPX(sec.gpxTrack);
        } catch(e) {
          console.error("Erreur d'affichage de la carte :", e);
        }
      }, 150);
    }


    // --- MODULE TABLEAUX NATIFS INTÉGRÉS ---
    function addNativeTable(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.tables.push({
        id: 'tbl_' + Date.now(),
        title: "Nouveau Tableau",
        headers: ["Colonne 1", "Colonne 2", "Colonne 3"],
        rows: [ ["", "", ""] ]
      });
      saveData();
      renderActiveSection();
    }

    function updateTableTitle(secId, tableId, val) {
      const sec = appData.sections.find(s => s.id === secId);
      const table = sec?.tables.find(t => t.id === tableId);
      if (table) { table.title = val; saveData(); }
    }

      const table = sec?.tables.find(t => t.id === tableId);
      if (table) { table.headers[colIndex] = val; saveData(); }
    }

    function updateTableCell(secId, tableId, rowIndex, colIndex, val) {
      const sec = appData.sections.find(s => s.id === secId);
      const table = sec?.tables.find(t => t.id === tableId);
      if (table) { table.rows[rowIndex][colIndex] = val; saveData(); }
    }

    function addTableRow(secId, tableId) {
      const sec = appData.sections.find(s => s.id === secId);
      const table = sec?.tables.find(t => t.id === tableId);
      if (table) {
        const newRow = new Array(table.headers.length).fill("");
        table.rows.push(newRow);
        saveData(); 
        renderActiveSection();
      }
    }

    function addTableColumn(secId, tableId) {
      const sec = appData.sections.find(s => s.id === secId);
      const table = sec?.tables.find(t => t.id === tableId);
      if (table) {
        table.headers.push("Nouvelle Col");
        table.rows.forEach(row => row.push(""));
        saveData(); 
        renderActiveSection();
      }
    }

    function deleteTableRow(secId, tableId, rowIndex) {
      const sec = appData.sections.find(s => s.id === secId);
      const table = sec?.tables.find(t => t.id === tableId);
      if (table) {
        table.rows.splice(rowIndex, 1);
        saveData(); 
        renderActiveSection();
      }
    }

    function getContactOptionsHtml(selectedId, secId) {
      let html = `<option value="">-- Non assigné --</option>`;
      
      const sec = appData.sections.find(s => s.id === secId);
      if (sec && sec.localContacts && sec.localContacts.length > 0) {
        html += `<optgroup label="Contacts de cette section">`;
        sec.localContacts.forEach(c => {
          html += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name} (${c.role})</option>`;
        });
        html += `</optgroup>`;
      }

      const globals = Array.isArray(appData.contacts) ? appData.contacts : Object.values(appData.contacts || {});
      if (globals.length > 0) {
        html += `<optgroup label="Répertoire Global">`;
        globals.forEach(c => {
          html += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name} (${c.role})</option>`;

        html += `</optgroup>`;
      }
      return html;

      });

      card.innerHTML = `
        <div class="border-b pb-3 mb-3"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-list-check text-emerald-600"></i> Liste des Tâches (${sec.tasks.length})</h3></div>
        <div class="space-y-3">${listHtml}</div>
      `;
      container.appendChild(card);
    }
    
    function addNewTask(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.tasks.push({ id: 'k_' + Date.now(), name: "Nouvelle tâche", resp: "", date: new Date().toISOString().split('T')[0], status: "À faire", notes: "" });
      saveData(); renderActiveSection();
    }
    function updateTaskField(secId, taskId, field, value) {
      const sec = appData.sections.find(s => s.id === secId);
      const task = sec?.tasks.find(t => t.id === taskId);
      if (task) { task[field] = value; saveData(); }
    }
    function deleteTask(secId, taskId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (sec) { sec.tasks = sec.tasks.filter(t => t.id !== taskId); saveData(); renderActiveSection(); }
    }


    // --- MODULE NOTES (Pense-bêtes) ---
    function renderStickyNotesModule(container, sec) {
      const card = document.createElement('div');
      card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 mb-6';
      
      let listHtml = '';
      sec.stickyNotes.forEach(note => {
        listHtml += `
          <div class="p-3 bg-amber-50/80 border border-amber-200 rounded-xl space-y-1.5 relative group">
            <button onclick="deleteStickyNote('${sec.id}', '${note.id}')" class="absolute top-2 right-2 text-amber-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-xmark"></i></button>
            <input type="text" value="${note.title || ''}" placeholder="Titre de la note..." onchange="updateStickyNote('${sec.id}', '${note.id}', 'title', this.value)" class="font-bold text-amber-900 bg-transparent w-full focus:bg-white focus:p-0.5 rounded text-xs">
            <textarea placeholder="Contenu de la note..." onchange="updateStickyNote('${sec.id}', '${note.id}', 'content', this.value)" class="w-full text-amber-800 text-xs bg-transparent border-none p-0 resize-none focus:bg-white focus:p-1 rounded min-h-[50px]">${note.content || ''}</textarea>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="border-b pb-3 mb-3"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-note-sticky text-amber-500"></i> Pense-Bêtes & Notes (${sec.stickyNotes.length})</h3></div>
        <div class="space-y-3">${listHtml}</div>
      `;
      container.appendChild(card);
    }

    function addStickyNote(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.stickyNotes.push({ id: 'sn_' + Date.now(), title: "Nouvelle Note", content: "" });
      saveData(); renderActiveSection();
    }
    function updateStickyNote(secId, noteId, field, val) {
      const sec = appData.sections.find(s => s.id === secId);
      const note = sec?.stickyNotes.find(n => n.id === noteId);
      if (note) { note[field] = val; saveData(); }
    }
    function deleteStickyNote(secId, noteId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (sec) { sec.stickyNotes = sec.stickyNotes.filter(n => n.id !== noteId); saveData(); renderActiveSection(); }
    }


    // --- MODULE AGENDA / PLANNING ---
    function renderAgendaModule(container, sec) {
      const card = document.createElement('div');
      card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 mb-6';
      
      let listHtml = '';
      sec.timeline.forEach((item) => {
        listHtml += `
          <div class="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
            <input type="time" value="${item.time || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'time', this.value)" class="w-24 font-bold text-emerald-700 bg-white border rounded p-1 text-center">
            <input type="text" placeholder="Activité" value="${item.activity || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'activity', this.value)" class="flex-1 font-medium bg-white border rounded p-1">
            <button onclick="deleteAgendaItem('${sec.id}', '${item.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="border-b pb-3 mb-3"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-clock text-rose-500"></i> Chronologie / Agenda (${sec.timeline.length})</h3></div>
        <div class="space-y-2">${listHtml}</div>
      `;
      container.appendChild(card);
    }
    
    function addAgendaSlot(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.timeline.push({ id: 't_' + Date.now(), time: "08:00", activity: "Nouvel événement" });
      saveData(); renderActiveSection();
    }
    function updateAgendaItem(secId, itemId, field, val) {
      const sec = appData.sections.find(s => s.id === secId);
      const item = sec?.timeline.find(t => t.id === itemId);
      if (item) { item[field] = val; saveData(); }
    }
    function deleteAgendaItem(secId, itemId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (sec) { sec.timeline = sec.timeline.filter(t => t.id !== itemId); saveData(); renderActiveSection(); }
    }


    // -- UTILS GLOBALES --
    function addNewCustomSectionPrompt() {
      const title = prompt("Nom de la nouvelle section :");
      if (title) {
        appData.sections.push({
          id: 'sec_' + Date.now(), title: title, type: "standard",
          tasks: [], stickyNotes: [], timeline: [], sheets: [], tables: [], localContacts: [], images: [], attachments: []
        });
        saveData(); renderSidebar();
      }
    }

    window.onload = initAppData;
  </script>
</body>
</html>
