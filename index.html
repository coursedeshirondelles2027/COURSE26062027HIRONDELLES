<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organisateur Événement Trail & Course à Pied</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- SDK FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .draggable-item { cursor: grab; }
    .draggable-item:active { cursor: grabbing; }
    .drag-over { border: 2px dashed #6366f1 !important; background-color: #f0f3ff !important; }
    .dragging { opacity: 0.4; }
    #gpx-map { height: 450px; width: 100%; border-radius: 0.75rem; z-index: 10; }
  </style>
</head>
<body class="h-full font-sans text-slate-800 bg-slate-100 flex flex-col antialiased">

  <!-- TOP HEADER BANNER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center shrink-0">
          <i class="fa-solid fa-person-running text-xl"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 id="event-title-display" class="text-xl font-bold text-slate-900 tracking-tight">Course des Hirondelles 2027</h1>
          </div>
          <p class="text-xs text-slate-500 flex flex-wrap items-center gap-3 mt-0.5">
            <span><i class="fa-regular fa-calendar text-emerald-600 mr-1"></i><span id="event-date-display">26 juin 2027</span></span>
            <span><i class="fa-solid fa-location-dot text-rose-500 mr-1"></i><span id="event-location-display">Saint-Pierre-d'Irube</span></span>
            <span class="bg-emerald-100 text-emerald-800 font-medium px-2 py-0.5 rounded-full text-[10px]" id="event-formats-display">10k, Relais, Marche</span>
          </p>
        </div>
      </div>

      <div class="flex items-center flex-wrap gap-2">
        <button onclick="saveData(true)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 transition shadow-sm">
          <i class="fa-solid fa-floppy-disk"></i> Enregistrer
        </button>

        <span id="save-indicator" class="text-[11px] text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-md flex items-center gap-1 font-medium">
          <i class="fa-solid fa-check"></i> Synchronisé
        </span>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="flex-1 flex overflow-hidden">

    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 shadow-sm">
      <div class="p-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Modules & Sections</span>
        <button onclick="addNewCustomSectionPrompt()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-2 py-1 rounded flex items-center gap-1">
          <i class="fa-solid fa-plus text-[10px]"></i> Section
        </button>
      </div>

      <nav id="sidebar-sections-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto bg-slate-100 p-4 md:p-6" id="main-content-viewport">
    </main>

  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://hiron27-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const eventRef = db.ref('eventData');

    const defaultData = {
      config: {
        title: "Course des Hirondelles 2027",
        date: "26 juin 2027",
        location: "Saint-Pierre-d'Irube",
        formats: ["10 km Solo (2x5km)", "10 km Relais", "10 km Marche"],
        gmapsUrl: "https://maps.google.com"
      },
      contacts: [
        { id: "c1", name: "Jean-Louis", role: "Responsable Administratif / Mairie", phone: "", email: "", org: "Club Athlé", notes: "" },
        { id: "c2", name: "Jérôme", role: "Référent Groupe Route", phone: "", email: "", org: "Ainarak", notes: "" },
        { id: "c3", name: "Niko", role: "Référent Groupe Route", phone: "", email: "", org: "Ainarak", notes: "" },
        { id: "c4", name: "Lucie", role: "Référente Groupe Trail", phone: "", email: "", org: "Ainarak", notes: "" },
        { id: "c5", name: "Beñat", role: "Référent Groupe Trail", phone: "", email: "", org: "Ainarak", notes: "" }
      ],
      sections: [
        {
          id: "sec-0",
          title: "Planning Jour J (Agenda)",
          icon: "fa-calendar-check",
          type: "agenda",
          timeline: [
            { id: "t1", time: "06:30", activity: "Arrivée équipe logistique & Ravitaillement", location: "Site Principal & Relais 5km", resp: "c1", status: "Confirmé" },
            { id: "t2", time: "07:00", activity: "Ouverture Retrait des Dossards & Inscriptions Jour J", location: "Bureau des dossards", resp: "c1", status: "Confirmé" }
          ],
          stickyNotes: [
            { id: "sn1", title: "Micro & Musique", content: "Le speaker gère la sonorisation de 7h00 à 13h00 non-stop." }
          ]
        },
        {
          id: "sec-1",
          title: "1. Course & Tracé (Administratif)",
          icon: "fa-map-location-dot",
          type: "trace_admin",
          gpxTrack: null,
          tasks: [
            { id: "k1", name: "Création du tracé officiel Google Maps & Export GPX", resp: "c1", date: "2027-02-15", status: "Validé", notes: "Tracé 2 boucles" }
          ],
          stickyNotes: []
        },
        {
          id: "sec-2",
          title: "2. Bénévoles Courses",
          icon: "fa-person-digging",
          type: "contacts",
          stickyNotes: []
        },
        {
          id: "sec-3",
          title: "3. Bénévoles Hors Courses",
          icon: "fa-warehouse",
          type: "contacts",
          stickyNotes: []
        },
        {
          id: "sec-8",
          title: "8. Recherche de Lots & Sponsoring",
          icon: "fa-handshake",
          type: "standard",
          tasks: [
            { id: "k19", name: "Démarchage sponsors financiers", resp: "c2", date: "2027-03-01", status: "En cours", notes: "Lots vainqueurs" }
          ],
          stickyNotes: []
        },
        {
          id: "sec-contacts",
          title: "Répertoire Global des Contacts",
          icon: "fa-address-book",
          type: "contacts",
          stickyNotes: []
        }
      ]
    };

    let appData = null;
    let activeSectionId = null;
    let leafletMap = null;
    let leafletPolyline = null;

    function initAppData() {
      eventRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          appData = sanitizeData(data);
        } else {
          appData = defaultData;
          eventRef.set(appData);
        }
        
        if (!activeSectionId && appData.sections.length > 0) {
          activeSectionId = appData.sections[0].id;
        }

        renderHeader();
        renderSidebar();
        renderActiveSection();
      });
    }

    function sanitizeData(data) {
      if (!data.sections) data.sections = [];
      if (!Array.isArray(data.sections)) data.sections = Object.values(data.sections);

      data.sections.forEach(sec => {
        // Détecte automatiquement si la section contient le mot "Bénévole" ou "Contact" pour basculer en mode répertoire de contacts sans tâches
        if (sec.title && (sec.title.toLowerCase().includes('bénévole') || sec.title.toLowerCase().includes('contact'))) {
          sec.type = 'contacts';
        }

        if (!sec.tasks) sec.tasks = [];
        if (!Array.isArray(sec.tasks)) sec.tasks = Object.values(sec.tasks);
        
        if (!sec.stickyNotes) sec.stickyNotes = [];
        if (!Array.isArray(sec.stickyNotes)) sec.stickyNotes = Object.values(sec.stickyNotes);

        if (!sec.timeline) sec.timeline = [];
        if (!Array.isArray(sec.timeline)) sec.timeline = Object.values(sec.timeline);
      });

      if (!data.contacts) data.contacts = [];
      if (!Array.isArray(data.contacts)) data.contacts = Object.values(data.contacts);

      return data;
    }

    function saveData(explicitNotification = false) {
      if (!appData) return;
      eventRef.set(appData).then(() => {
        const ind = document.getElementById('save-indicator');
        if (ind) {
          ind.innerHTML = '<i class="fa-solid fa-check"></i> Synchronisé';
        }
        if (explicitNotification) alert("Données enregistrées.");
      });
    }

    function renderHeader() {
      document.getElementById('event-title-display').innerText = appData.config.title || "";
      document.getElementById('event-date-display').innerText = appData.config.date || "";
      document.getElementById('event-location-display').innerText = appData.config.location || "";
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-sections-list');
      container.innerHTML = '';

      appData.sections.forEach((sec) => {
        const isActive = sec.id === activeSectionId;
        const item = document.createElement('div');
        item.className = `flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium cursor-pointer ${
          isActive ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'
        }`;
        
        item.onclick = () => {
          activeSectionId = sec.id;
          renderSidebar();
          renderActiveSection();
        };

        item.innerHTML = `<div class="flex items-center space-x-2"><i class="fa-solid ${sec.icon || 'fa-folder'} text-xs"></i><span>${sec.title}</span></div>`;
        container.appendChild(item);
      });
    }

    function renderActiveSection() {
      const container = document.getElementById('main-content-viewport');
      const sec = appData.sections.find(s => s.id === activeSectionId);
      if (!sec) return;

      container.innerHTML = '';

      const headerBox = document.createElement('div');
      headerBox.className = 'bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex justify-between items-center';
      
      let headerActionBtn = '';
      if (sec.type === 'contacts') {
        headerActionBtn = `
          <button onclick="addNewContact()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-user-plus"></i> Ajouter un contact
          </button>
        `;
      } else if (sec.type !== 'agenda') {
        headerActionBtn = `
          <button onclick="addNewTask('${sec.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-plus"></i> Ajouter une tâche
          </button>
        `;
      }

      headerBox.innerHTML = `
        <h2 class="text-xl font-bold text-slate-900">${sec.title}</h2>
        ${headerActionBtn}
      `;
      container.appendChild(headerBox);

      if (sec.type === 'contacts') {
        renderContactsModule(container);
      } else if (sec.type === 'agenda') {
        renderAgendaModule(container, sec);
      } else if (sec.type === 'trace_admin') {
        renderMapModule(container, sec);
        renderTasksList(container, sec);
      } else {
        renderTasksList(container, sec);
      }

      if (sec.type !== 'agenda') {
        renderStickyNotesModule(container, sec);
      }
    }

    // --- MODULE REPERTOIRE DES CONTACTS ---
    function renderContactsModule(container) {
      const card = document.createElement('div');
      card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 mb-6';
      
      const contacts = appData.contacts || [];
      card.innerHTML = `
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-address-book text-emerald-600"></i> Répertoire des Contacts (${contacts.length})
          </h3>
          <button onclick="addNewContact()" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium px-2.5 py-1.5 rounded-lg border border-emerald-200">
            + Nouveau Contact
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-700">
            <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-[10px] border-b">
              <tr>
                <th class="p-2.5">Nom</th>
                <th class="p-2.5">Rôle</th>
                <th class="p-2.5">Entité / Club</th>
                <th class="p-2.5">Téléphone</th>
                <th class="p-2.5">Email</th>
                <th class="p-2.5 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="contacts-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      `;
      container.appendChild(card);

      const tbody = card.querySelector('#contacts-table-body');

      if (contacts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 italic">Aucun contact enregistré.</td></tr>`;
        return;
      }

      contacts.forEach(c => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition';
        tr.innerHTML = `
          <td class="p-2.5 font-bold text-slate-900"><input type="text" value="${c.name || ''}" onchange="updateContactField('${c.id}', 'name', this.value)" class="bg-transparent border-b border-transparent focus:border-emerald-500 focus:bg-white w-full"></td>
          <td class="p-2.5"><input type="text" value="${c.role || ''}" onchange="updateContactField('${c.id}', 'role', this.value)" class="bg-transparent border-b border-transparent focus:border-emerald-500 focus:bg-white w-full"></td>
          <td class="p-2.5"><input type="text" value="${c.org || ''}" onchange="updateContactField('${c.id}', 'org', this.value)" class="bg-transparent border-b border-transparent focus:border-emerald-500 focus:bg-white w-full"></td>
          <td class="p-2.5"><input type="text" value="${c.phone || ''}" onchange="updateContactField('${c.id}', 'phone', this.value)" class="bg-transparent border-b border-transparent focus:border-emerald-500 focus:bg-white w-full"></td>
          <td class="p-2.5"><input type="text" value="${c.email || ''}" onchange="updateContactField('${c.id}', 'email', this.value)" class="bg-transparent border-b border-transparent focus:border-emerald-500 focus:bg-white w-full"></td>
          <td class="p-2.5 text-right">
            <button onclick="deleteContact('${c.id}')" class="text-slate-400 hover:text-rose-600 p-1"><i class="fa-solid fa-trash-can"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addNewContact() {
      if (!appData.contacts) appData.contacts = [];
      appData.contacts.push({
        id: 'c_' + Date.now(),
        name: "Nouveau Contact",
        role: "Bénévole",
        org: "Club",
        phone: "",
        email: "",
        notes: ""
      });
      saveData();
      renderActiveSection();
    }

    function updateContactField(contactId, field, value) {
      const c = appData.contacts.find(x => x.id === contactId);
      if (c) {
        c[field] = value;
        saveData();
      }
    }

    function deleteContact(contactId) {
      appData.contacts = appData.contacts.filter(x => x.id !== contactId);
      saveData();
      renderActiveSection();
    }

    // --- MODULE D'IMPORTATION & CARTE GPX ---
    function renderMapModule(container, sec) {
      const mapCard = document.createElement('div');
      mapCard.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6 space-y-4';
      mapCard.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3">
          <div>
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
              <i class="fa-solid fa-map text-emerald-600"></i> Carte Interactive & Visualiseur GPX
            </h3>
            <p class="text-xs text-slate-500">Choisissez la vue Satellite ou Plan en haut à droite.</p>
          </div>
          <div class="flex items-center gap-2">
            <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1.5 shadow-sm transition">
              <i class="fa-solid fa-file-code"></i> Charger Fichier GPX
              <input type="file" onchange="handleGPXUpload(event, '${sec.id}')" accept=".gpx" class="hidden">
            </label>
          </div>
        </div>

        <div id="gpx-stats-bar" class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 text-center text-xs">
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Distance</span><span id="gpx-dist-val" class="text-base font-extrabold text-emerald-700">-- km</span></div>
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Dénivelé (D+)</span><span id="gpx-ele-val" class="text-base font-extrabold text-indigo-700">-- m</span></div>
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Points</span><span id="gpx-pts-val" class="text-base font-bold text-slate-700">--</span></div>
          <div><span class="text-slate-400 block text-[10px] uppercase font-bold">Statut</span><span id="gpx-status-val" class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full inline-block mt-0.5">En attente</span></div>
        </div>

        <div id="gpx-map"></div>
      `;
      container.appendChild(mapCard);

      setTimeout(() => {
        try {
          if (leafletMap) { leafletMap.remove(); }
          
          leafletMap = L.map('gpx-map').setView([43.4633, -1.4519], 13);

          const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
          });

          const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri'
          });

          osmStandard.addTo(leafletMap);

          L.control.layers({
            "🗺️ Plan (OpenStreetMap)": osmStandard,
            "🛰️ Satellite (Esri)": esriSatellite
          }, null, { position: 'topright' }).addTo(leafletMap);

          leafletMap.invalidateSize();

          if (sec.gpxTrack) displayParsedGPX(sec.gpxTrack);
        } catch(e) {
          console.error("Erreur d'affichage de la carte :", e);
        }
      }, 150);
    }

    function handleGPXUpload(event, secId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const sec = appData.sections.find(s => s.id === secId);
        if (sec) {
          sec.gpxTrack = e.target.result;
          saveData();
          displayParsedGPX(e.target.result);
        }
      };
      reader.readAsText(file);
    }

    function parseGPXText(gpxXmlText) {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(gpxXmlText, "text/xml");
        const points = [];
        const elements = xmlDoc.querySelectorAll("trkpt, wpt, rtept");
        elements.forEach(pt => {
          const lat = parseFloat(pt.getAttribute("lat"));
          const lon = parseFloat(pt.getAttribute("lon"));
          const eleNode = pt.querySelector("ele");
          const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
          if (!isNaN(lat) && !isNaN(lon)) { points.push({ lat, lon, ele }); }
        });
        return points;
      } catch(err) { return []; }
    }

    function calculateHaversineDistance(p1, p2) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const dLat = (p2.lat - p1.lat) * rad;
      const dLon = (p2.lon - p1.lon) * rad;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(p1.lat * rad) * Math.cos(p2.lat * rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function calculateGPXStats(points) {
      if (!points || points.length < 2) return { distanceKm: 0, eleGain: 0 };
      let totalDist = 0, totalGain = 0;
      for (let i = 1; i < points.length; i++) {
        totalDist += calculateHaversineDistance(points[i-1], points[i]);
        const eleDiff = points[i].ele - points[i-1].ele;
        if (eleDiff > 0.5) totalGain += eleDiff;
      }
      return { distanceKm: (totalDist / 1000).toFixed(2), eleGain: Math.round(totalGain) };
    }

    function displayParsedGPX(gpxXmlText) {
      const points = parseGPXText(gpxXmlText);
      if (!points || points.length === 0) return;
      const latLngs = points.map(p => [p.lat, p.lon]);

      if (leafletMap) {
        if (leafletPolyline) leafletMap.removeLayer(leafletPolyline);
        leafletPolyline = L.polyline(latLngs, { color: '#16a34a', weight: 5, opacity: 0.9, lineJoin: 'round' }).addTo(leafletMap);
        leafletMap.fitBounds(leafletPolyline.getBounds(), { padding: [30, 30] });
        leafletMap.invalidateSize();
      }

      const stats = calculateGPXStats(points);
      document.getElementById('gpx-dist-val').innerText = `${stats.distanceKm} km`;
      document.getElementById('gpx-ele-val').innerText = `+${stats.eleGain} m`;
      document.getElementById('gpx-pts-val').innerText = points.length;
      document.getElementById('gpx-status-val').innerText = "Tracé Chargé";
      document.getElementById('gpx-status-val').className = "text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full inline-block mt-0.5";
    }

    // --- MODULE TÂCHES COMPLET ---
    function renderTasksList(container, sec) {
      const card = document.createElement('div');
      card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 mb-6';
      
      const tasks = sec.tasks || [];
      card.innerHTML = `
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-list-check text-emerald-600"></i> Liste des Tâches (${tasks.length})
          </h3>
          <button onclick="addNewTask('${sec.id}')" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium px-2 py-1 rounded border border-emerald-200">
            + Ajouter
          </button>
        </div>
        <div id="tasks-container" class="space-y-3"></div>
      `;
      container.appendChild(card);

      const tasksContainer = card.querySelector('#tasks-container');

      if (tasks.length === 0) {
        tasksContainer.innerHTML = `<p class="text-xs text-slate-400 italic py-2">Aucune tâche enregistrée.</p>`;
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs hover:border-slate-300 transition';
        const statusColors = {
          'À faire': 'bg-slate-200 text-slate-700',
          'En cours': 'bg-amber-100 text-amber-800 border-amber-300',
          'Validé': 'bg-emerald-100 text-emerald-800 border-emerald-300'
        };
        const currentStatus = task.status || 'À faire';

        item.innerHTML = `
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <input type="text" value="${task.name || ''}" onchange="updateTaskField('${sec.id}', '${task.id}', 'name', this.value)" class="font-bold text-slate-900 bg-transparent flex-1 border-b border-transparent focus:border-emerald-500 focus:bg-white rounded px-1">
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <select onchange="updateTaskField('${sec.id}', '${task.id}', 'status', this.value)" class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${statusColors[currentStatus] || 'bg-slate-100'}">
                <option value="À faire" ${currentStatus === 'À faire' ? 'selected' : ''}>À faire</option>
                <option value="En cours" ${currentStatus === 'En cours' ? 'selected' : ''}>En cours</option>
                <option value="Validé" ${currentStatus === 'Validé' ? 'selected' : ''}>Validé</option>
              </select>
              <button onclick="deleteTask('${sec.id}', '${task.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1 text-slate-500">
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-user text-slate-400 text-[10px]"></i>
              <select onchange="updateTaskField('${sec.id}', '${task.id}', 'resp', this.value)" class="bg-white border border-slate-200 rounded p-1 w-full text-slate-700">
                ${getContactOptionsHtml(task.resp)}
              </select>
            </div>
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-calendar text-slate-400 text-[10px]"></i>
              <input type="date" value="${task.date || ''}" onchange="updateTaskField('${sec.id}', '${task.id}', 'date', this.value)" class="bg-white border border-slate-200 rounded p-1 w-full text-slate-700">
            </div>
            <div class="flex items-center gap-1">
              <i class="fa-solid fa-comment text-slate-400 text-[10px]"></i>
              <input type="text" value="${task.notes || ''}" placeholder="Notes..." onchange="updateTaskField('${sec.id}', '${task.id}', 'notes', this.value)" class="bg-white border border-slate-200 rounded p-1 w-full text-slate-700">
            </div>
          </div>
        `;
        tasksContainer.appendChild(item);
      });
    }

    function getContactOptionsHtml(selectedId) {
      let html = `<option value="">-- Non assigné --</option>`;
      const contactsArr = Array.isArray(appData.contacts) ? appData.contacts : (appData.contacts ? Object.values(appData.contacts) : []);
      contactsArr.forEach(c => {
        html += `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name} (${c.role})</option>`;
      });
      return html;
    }

    function addNewTask(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.tasks.push({
        id: 'k_' + Date.now(),
        name: "Nouvelle tâche",
        resp: "",
        date: new Date().toISOString().split('T')[0],
        status: "À faire",
        notes: ""
      });
      saveData();
      renderActiveSection();
    }

    function updateTaskField(secId, taskId, field, value) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      const task = sec.tasks.find(t => t.id === taskId);
      if (task) {
        task[field] = value;
        saveData();
      }
    }

    function deleteTask(secId, taskId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.tasks = sec.tasks.filter(t => t.id !== taskId);
      saveData();
      renderActiveSection();
    }

    // --- MODULE PENSE-BÊTES & NOTES ---
    function renderStickyNotesModule(container, sec) {
      const card = document.createElement('div');
      card.className = 'bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4';
      
      const notes = sec.stickyNotes || [];
      card.innerHTML = `
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-note-sticky text-amber-500"></i> Pense-Bêtes & Notes (${notes.length})
          </h3>
          <button onclick="addStickyNote('${sec.id}')" class="text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 font-medium px-2.5 py-1.5 rounded-lg border border-amber-200">
            + Ajouter une note
          </button>
        </div>
        <div id="sticky-notes-container" class="space-y-3"></div>
      `;
      container.appendChild(card);

      const notesContainer = card.querySelector('#sticky-notes-container');

      if (notes.length === 0) {
        notesContainer.innerHTML = `<p class="text-xs text-slate-400 italic">Aucune note pour le moment.</p>`;
        return;
      }

      notes.forEach(note => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-amber-50/80 border border-amber-200 rounded-xl space-y-1.5 relative group';
        item.innerHTML = `
          <button onclick="deleteStickyNote('${sec.id}', '${note.id}')" class="absolute top-2 right-2 text-amber-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-xmark"></i></button>
          <input type="text" value="${note.title || ''}" placeholder="Titre de la note..." onchange="updateStickyNote('${sec.id}', '${note.id}', 'title', this.value)" class="font-bold text-amber-900 bg-transparent w-full focus:bg-white focus:p-0.5 rounded text-xs">
          <textarea placeholder="Contenu de la note..." onchange="updateStickyNote('${sec.id}', '${note.id}', 'content', this.value)" class="w-full text-amber-800 text-xs bg-transparent border-none p-0 resize-none focus:bg-white focus:p-1 rounded min-h-[50px]">${note.content || ''}</textarea>
        `;
        notesContainer.appendChild(item);
      });
    }

    function addStickyNote(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.stickyNotes.push({ id: 'sn_' + Date.now(), title: "Titre de la note", content: "" });
      saveData();
      renderActiveSection();
    }

    function updateStickyNote(secId, noteId, field, val) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      const note = sec.stickyNotes.find(n => n.id === noteId);
      if (note) { note[field] = val; saveData(); }
    }

    function deleteStickyNote(secId, noteId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.stickyNotes = sec.stickyNotes.filter(n => n.id !== noteId);
      saveData();
      renderActiveSection();
    }

    // --- MODULE AGENDA / PLANNING JOUR J ---
    function renderAgendaModule(container, sec) {
      const wrapper = document.createElement('div');
      wrapper.className = 'grid grid-cols-1 lg:grid-cols-3 gap-6';

      const timelineCol = document.createElement('div');
      timelineCol.className = 'lg:col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4';
      timelineCol.innerHTML = `
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-clock text-emerald-600"></i> Chronologie Jour J
          </h3>
          <button onclick="addAgendaSlot('${sec.id}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2.5 py-1.5 rounded-lg border">
            + Ajouter créneau
          </button>
        </div>
        <div id="agenda-timeline-items" class="space-y-2"></div>
      `;

      const notesCol = document.createElement('div');
      notesCol.id = 'agenda-notes-container';

      wrapper.appendChild(timelineCol);
      wrapper.appendChild(notesCol);
      container.appendChild(wrapper);

      const itemsContainer = timelineCol.querySelector('#agenda-timeline-items');
      sec.timeline.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs';
        row.innerHTML = `
          <input type="text" value="${item.time || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'time', this.value)" class="w-16 font-bold text-emerald-700 bg-white border rounded p-1 text-center">
          <input type="text" value="${item.activity || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'activity', this.value)" class="flex-1 font-medium bg-white border rounded p-1">
          <button onclick="deleteAgendaItem('${sec.id}', '${item.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
        `;
        itemsContainer.appendChild(row);
      });

      renderStickyNotesModule(notesCol, sec);
    }

    function addAgendaSlot(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.timeline.push({ id: 't_' + Date.now(), time: "10:00", activity: "Nouvel événement" });
      saveData();
      renderActiveSection();
    }

    function updateAgendaItem(secId, itemId, field, val) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      const item = sec.timeline.find(t => t.id === itemId);
      if (item) { item[field] = val; saveData(); }
    }

    function deleteAgendaItem(secId, itemId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      sec.timeline = sec.timeline.filter(t => t.id !== itemId);
      saveData();
      renderActiveSection();
    }

    function addNewCustomSectionPrompt() {
      const title = prompt("Nom de la section :");
      if (title) {
        // Détecte si la section créée par l'utilisateur doit être de type contact
        const isContactSec = title.toLowerCase().includes('bénévole') || title.toLowerCase().includes('contact');
        appData.sections.push({
          id: 'sec_' + Date.now(),
          title: title,
          type: isContactSec ? "contacts" : "standard",
          tasks: [],
          stickyNotes: []
        });
        saveData();
        renderSidebar();
      }
    }

    window.onload = initAppData;
  </script>
</body>
</html>
