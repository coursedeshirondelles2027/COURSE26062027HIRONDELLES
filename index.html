    let appData = null;
    let activeSectionId = null;
    let leafletMaps = {};
    let draggedModuleId = null;

    function initAppData() {
      eventRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          appData = sanitizeData(data);
        } else {
          appData = defaultData;
          eventRef.set(appData);
        }
        
        if (!activeSectionId && appData.sections.length > 0) activeSectionId = appData.sections[0].id;

        renderHeader();
        renderSidebar();
        renderActiveSection();
      });
    }

    function sanitizeData(data) {
      if (!data.sections) data.sections = [];
      if (!Array.isArray(data.sections)) data.sections = Object.values(data.sections);

      data.sections.forEach(sec => {
        if (!sec.layout) sec.layout = [];
        if (!sec.tables) sec.tables = []; else {
          sec.tables = Object.values(sec.tables);
          sec.tables.forEach(t => {
            if (!t.headers) t.headers = ["Col 1", "Col 2", "Col 3"];
            if (!t.rows) t.rows = [];
            t.rows = t.rows.map(r => {
              if (!Array.isArray(r)) r = [];
              while(r.length < t.headers.length) r.push("");
              return r.slice(0, t.headers.length);
            });
          });
        }
        if (!sec.tasks) sec.tasks = []; else {
          sec.tasks = Object.values(sec.tasks);
          sec.tasks.forEach(t => {
            if (!t.resps) {
              t.resps = t.resp ? [t.resp] : [];
              delete t.resp;
            }
          });
        }
        if (!sec.stickyNotes) sec.stickyNotes = []; else sec.stickyNotes = Object.values(sec.stickyNotes);
        if (!sec.timeline) sec.timeline = []; else sec.timeline = Object.values(sec.timeline);
        if (!sec.sheets) sec.sheets = []; else sec.sheets = Object.values(sec.sheets);
        if (!sec.localContacts) sec.localContacts = []; else sec.localContacts = Object.values(sec.localContacts);
        if (!sec.images) sec.images = []; else sec.images = Object.values(sec.images);
        if (!sec.attachments) sec.attachments = []; else sec.attachments = Object.values(sec.attachments);
        if (!sec.gpxTracks) {
          sec.gpxTracks = [];
          if (sec.gpxTrack) { sec.gpxTracks.push({id: 'gpx_legacy', name: 'Tracé principal', data: sec.gpxTrack}); delete sec.gpxTrack; }
        } else {
          sec.gpxTracks = Object.values(sec.gpxTracks);
        }
      });

      if (!data.contacts) data.contacts = [];
      if (!Array.isArray(data.contacts)) data.contacts = Object.values(data.contacts);
      data.contacts = data.contacts.filter(c => !(c.id && c.id.startsWith('csv_')));

      return data;
    }

    function saveData(explicitNotification = false) {
      if (!appData) return;
      eventRef.set(appData).then(() => {
        const ind = document.getElementById('save-indicator');
        if (ind) ind.innerHTML = '<i class="fa-solid fa-check"></i> Synchronisé';
        if (explicitNotification) alert("Données enregistrées.");
      });
    }

    function renderHeader() {
      document.getElementById('event-title-display').innerText = appData.config.title || "";
      document.getElementById('event-date-display').innerText = appData.config.date || "";
      document.getElementById('event-location-display').innerText = appData.config.location || "";
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-sections-list');
      container.innerHTML = '';

      appData.sections.forEach((sec) => {
        const isActive = sec.id === activeSectionId;
        const item = document.createElement('div');
        item.className = `flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium cursor-pointer ${
          isActive ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'
        }`;
        item.onclick = () => { activeSectionId = sec.id; renderSidebar(); renderActiveSection(); };
        item.innerHTML = `<div class="flex items-center space-x-2"><i class="fa-solid ${sec.icon || 'fa-folder'} text-xs"></i><span>${sec.title}</span></div>`;
        container.appendChild(item);
      });
    }

    function handleModuleDragStart(e, moduleId) {
      draggedModuleId = moduleId;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => e.target.classList.add('module-dragging'), 0);
    }
    function handleModuleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('module-drag-over'); }
    function handleModuleDragLeave(e) { e.currentTarget.classList.remove('module-drag-over'); }
    function handleModuleDrop(e, targetModuleId) {
      e.preventDefault();
      e.currentTarget.classList.remove('module-drag-over');
      if (!draggedModuleId || draggedModuleId === targetModuleId) return;

      const sec = appData.sections.find(s => s.id === activeSectionId);
      if (!sec) return;

      const oldIndex = sec.layout.indexOf(draggedModuleId);
      const newIndex = sec.layout.indexOf(targetModuleId);

      if (oldIndex > -1 && newIndex > -1) {
        sec.layout.splice(oldIndex, 1);
        sec.layout.splice(newIndex, 0, draggedModuleId);
        saveData();
        renderActiveSection();
      }
    }
    function handleModuleDragEnd(e) { if (e.target) e.target.classList.remove('module-dragging'); draggedModuleId = null; }

    function wrapModuleDraggable(moduleId, contentHtml) {
      return `
        <div draggable="true" 
             ondragstart="handleModuleDragStart(event, '${moduleId}')" 
             ondragover="handleModuleDragOver(event)" 
             ondragleave="handleModuleDragLeave(event)" 
             ondrop="handleModuleDrop(event, '${moduleId}')" 
             ondragend="handleModuleDragEnd(event)" 
             class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6 relative group transition-all">

            <button onclick="deleteSection('${sec.id}')" class="text-slate-300 hover:text-rose-600 transition" title="Supprimer"><i class="fa-solid fa-trash-can text-sm"></i></button>

          <button onclick="addStickyNote('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-amber-50 hover:text-amber-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-note-sticky"></i> Note</button>
          <button onclick="addLocalContact('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-user-plus"></i> Bénévoles / Staff</button>
          <button onclick="addNativeTable('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-green-50 hover:text-green-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-table"></i> Tableau Intégré</button>
          <label class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-blue-50 hover:text-blue-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition cursor-pointer"><i class="fa-solid fa-image"></i> Image<input type="file" accept="image/*" onchange="uploadImage(event, '${sec.id}')" class="hidden"></label>
          <label class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-purple-50 hover:text-purple-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition cursor-pointer"><i class="fa-solid fa-paperclip"></i> Pièce Jointe<input type="file" onchange="uploadAttachment(event, '${sec.id}')" class="hidden"></label>
          <button onclick="addAgendaSlot('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-rose-50 hover:text-rose-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-clock"></i> Planning</button>
        </div>
      `;
      container.appendChild(headerBox);

      const renderedModules = {};
      
      if (sec.type === 'trace_admin') renderedModules['mod_map'] = generateMapModuleHtml(sec);
      if (sec.type === 'contacts') renderedModules['mod_global_contacts'] = generateGlobalContactsHtml();

      sec.tables.forEach(t => renderedModules['tbl_' + t.id] = generateTableHtml(sec, t));
      sec.sheets.forEach(s => renderedModules['sht_' + s.id] = generateSheetHtml(sec, s));
      if (sec.timeline.length > 0) renderedModules['mod_agenda'] = generateAgendaHtml(sec);
      if (sec.tasks.length > 0) renderedModules['mod_tasks'] = generateTasksHtml(sec);
      if (sec.localContacts.length > 0) renderedModules['mod_local_contacts'] = generateLocalContactsHtml(sec);
      if (sec.images.length > 0) renderedModules['mod_images'] = generateImagesHtml(sec);
      if (sec.attachments.length > 0) renderedModules['mod_attachments'] = generateAttachmentsHtml(sec);
      if (sec.stickyNotes.length > 0) renderedModules['mod_notes'] = generateStickyNotesHtml(sec);

      const actualModuleIds = Object.keys(renderedModules);
      actualModuleIds.forEach(id => { if (!sec.layout.includes(id)) sec.layout.push(id); });
      sec.layout = sec.layout.filter(id => actualModuleIds.includes(id));

      sec.layout.forEach(id => {
        const div = document.createElement('div');

      if (sec.type === 'trace_admin') setTimeout(() => initMap(sec), 150);

    function renameSection(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      const newTitle = prompt("Nouveau nom de la section :", sec.title);
      if (newTitle && newTitle.trim() !== "") { sec.title = newTitle.trim(); saveData(); renderSidebar(); renderActiveSection(); }
    }
    function deleteSection(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (confirm(`Supprimer la section "${sec.title}" et son contenu ?`)) {
        appData.sections = appData.sections.filter(s => s.id !== secId);
        activeSectionId = appData.sections.length > 0 ? appData.sections[0].id : null;
        saveData(); renderSidebar();
        if (activeSectionId) renderActiveSection(); else document.getElementById('main-content-viewport').innerHTML = '';
      }
    }
    function addNewCustomSectionPrompt() {
      const title = prompt("Nom de la nouvelle section :");
      if (title) {
        const newId = 'sec_' + Date.now();
        appData.sections.push({ id: newId, title: title, type: "standard", layout: [], tasks: [], stickyNotes: [], timeline: [], sheets: [], tables: [], localContacts: [], images: [], attachments: [], gpxTracks: [] });
        if (!activeSectionId) activeSectionId = newId; // Sélection automatique si c'est la seule section
        saveData(); renderSidebar(); renderActiveSection();
      }
    }

    // --- NETTOYAGE DES CONTACTS SUPPRIMÉS ---
    function removeContactFromAllTasksAndAgendas(contactId) {
      appData.sections.forEach(s => {
        if (s.tasks) s.tasks.forEach(t => {
          if (t.resps && t.resps.includes(contactId)) {
            t.resps = t.resps.filter(id => id !== contactId);
          }
        });
        if (s.timeline) s.timeline.forEach(t => {
          if (t.resp === contactId) t.resp = "";
        });
      });
    }

    // --- CARTES GPX ---
    function generateMapModuleHtml(sec) {
      let mapsHtml = '';
      if (sec.gpxTracks.length === 0) {
        mapsHtml = `<div class="text-xs text-slate-400 italic mb-4">Aucun fichier GPX chargé.</div>`;
      } else {
        sec.gpxTracks.forEach(trk => {
          mapsHtml += `
            <div class="mb-5 border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white relative z-0">
              <div class="flex justify-between items-center bg-slate-50 p-2 border-b border-slate-200">
                <span class="font-bold text-emerald-700 text-xs"><i class="fa-solid fa-route mr-1"></i> ${trk.name}</span>
                <button onclick="deleteGPXTrack('${sec.id}', '${trk.id}')" class="text-rose-500 hover:text-rose-700 px-2 py-1"><i class="fa-solid fa-trash-can"></i></button>
              </div>
              <div id="map-${trk.id}" class="leaflet-map-container"></div>
            </div>
          `;
        });
      }

      const myMapsFrame = sec.myMapsUrl ? `<iframe src="${sec.myMapsUrl}" width="100%" height="480" class="rounded-xl border border-slate-200 mt-3" allowfullscreen></iframe>` : '';

      return wrapModuleDraggable('mod_map', `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3 mb-4 pr-6">
          <div><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-map text-emerald-600"></i> Cartes des Tracés (GPX)</h3></div>
          <div>
            <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1.5 transition">
              <i class="fa-solid fa-file-code"></i> Ajouter un GPX
              <input type="file" multiple onchange="handleGPXUpload(event, '${sec.id}')" accept=".gpx" class="hidden">
            </label>
          </div>
        </div>
        ${mapsHtml}
        <div class="mt-8 pt-4 border-t border-slate-100">
          <label class="text-xs font-bold text-slate-500 block mb-1">Intégration Google My Maps globale (URL Optionnelle) :</label>
          <input type="text" value="${sec.myMapsUrl || ''}" placeholder="Ex: https://www.google.com/maps/d/embed?mid=..." onchange="updateMyMapsUrl('${sec.id}', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded p-2 text-xs focus:border-emerald-500 outline-none">
          ${myMapsFrame}
        </div>
      `);
    }

    function updateMyMapsUrl(secId, val) { const sec = appData.sections.find(s => s.id === secId); if (sec) { sec.myMapsUrl = val; saveData(); renderActiveSection(); } }
    function handleGPXUpload(event, secId) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      const sec = appData.sections.find(s => s.id === secId);
      if (!sec) return;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) { sec.gpxTracks.push({ id: 'gpx_' + Date.now() + Math.random(), name: file.name, data: e.target.result }); saveData(); renderActiveSection(); };
        reader.readAsText(file);
      });
      event.target.value = ''; // Purge input file pour autoriser réimport
    }
    function deleteGPXTrack(secId, trackId) { const sec = appData.sections.find(s => s.id === secId); if (sec) { sec.gpxTracks = sec.gpxTracks.filter(t => t.id !== trackId); saveData(); renderActiveSection(); } }

    function initMap(sec) {
      Object.values(leafletMaps).forEach(m => m.remove());
      leafletMaps = {};

      sec.gpxTracks.forEach((trk) => {
        const mapContainerId = 'map-' + trk.id;
        const container = document.getElementById(mapContainerId);
        if (!container) return;

        const map = L.map(mapContainerId).setView([43.4633, -1.4519], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
        
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(trk.data, "text/xml");
        const points = [];
        xmlDoc.querySelectorAll("trkpt, wpt, rtept").forEach(pt => {
          const lat = parseFloat(pt.getAttribute("lat"));
          const lon = parseFloat(pt.getAttribute("lon"));
          if (!isNaN(lat) && !isNaN(lon)) points.push([lat, lon]);
        });
        
        if (points.length > 0) {
          const polyline = L.polyline(points, { color: '#16a34a', weight: 4, opacity: 0.9 }).addTo(map);
          map.fitBounds(polyline.getBounds(), { padding: [20, 20] });
        }
        leafletMaps[trk.id] = map;
      });
    }

    // --- CONTACTS GLOBAUX ---

      let rows = '';

        rows += `

            <td class="p-2"><input type="text" value="${c.email || ''}" onchange="updateGlobalContactField('${c.id}', 'email', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1"></td>

            <button onclick="addGlobalContact()" class="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1.5 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition whitespace-nowrap">+ Créer à la main</button>
          </div>
        </div>
        <div class="overflow-x-auto mt-4">
          <table class="w-full text-left text-xs text-slate-700">
            <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-[10px]">
              <tr><th class="p-2">Nom</th><th class="p-2">Entité / Club</th><th class="p-2">Téléphone</th><th class="p-2">Email</th><th class="p-2 text-right">Action</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `);
    }
    
    function addGlobalContactFromCSV(idx) {
      if(idx === "") return;
      const csvContact = IMPORTED_CSV_CONTACTS[idx];
      if(csvContact) {
        appData.contacts.push({ id: 'c_' + Date.now() + Math.random(), name: csvContact.name, org: "", phone: csvContact.phone, email: csvContact.email });
        saveData(); renderActiveSection();
      }
    }
    function addGlobalContact() { appData.contacts.push({ id: 'c_' + Date.now(), name: "Nouveau Contact", org: "", phone: "", email: "" }); saveData(); renderActiveSection(); }
    function updateGlobalContactField(cId, f, v) { const c = appData.contacts.find(x => x.id === cId); if (c) { c[f] = v; saveData(); } }
    function deleteGlobalContact(cId) { 
      appData.contacts = appData.contacts.filter(x => x.id !== cId); 
      removeContactFromAllTasksAndAgendas(cId); // Nettoyage de sécurité
      saveData(); 
      renderActiveSection(); 
    }


    function getAvailableContactsForTask(secId) {
      let list = [];
      const sec = appData.sections.find(s => s.id === secId);
      if (sec && sec.localContacts) {
        sec.localContacts.forEach(c => list.push({ id: c.id, name: c.name + ' (Bénévole section)' }));
      }
      if (appData.contacts) {
        appData.contacts.forEach(c => list.push({ id: c.id, name: c.name + ' (Répertoire)' }));
      }
      return list.sort((a,b) => a.name.localeCompare(b.name));
    }

    // --- TACHES ---
    function generateTasksHtml(sec) {
      let listHtml = '';
      sec.tasks.forEach(task => {
        if (!task.resps) task.resps = [];
        const currentStatus = task.status || 'À faire';
        const statusColors = { 'À faire': 'bg-slate-200 text-slate-700', 'En cours': 'bg-amber-100 text-amber-800', 'Validé': 'bg-emerald-100 text-emerald-800' };
        
        let assigneesHtml = '';
        task.resps.forEach((respId, rIdx) => {
          let contactName = "Inconnu (Supprimé)";
          const localC = sec.localContacts?.find(x => x.id === respId);
          const globalC = appData.contacts?.find(x => x.id === respId);
          if (localC) contactName = localC.name;
          else if (globalC) contactName = globalC.name;

          assigneesHtml += `
            <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-medium">
              <i class="fa-solid fa-user text-emerald-600 text-[10px]"></i> ${contactName}
              <button onclick="removeTaskAssignee('${sec.id}', '${task.id}', ${rIdx})" class="text-emerald-400 hover:text-rose-600 ml-1"><i class="fa-solid fa-xmark"></i></button>
            </span>
          `;
        });

        let selectOptions = `<option value="">+ Ajouter un responsable...</option>`;
        const available = getAvailableContactsForTask(sec.id);
        available.forEach(c => {
          if (!task.resps.includes(c.id)) {
            selectOptions += `<option value="${c.id}">${c.name}</option>`;
          }
        });

        listHtml += `
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2.5 text-xs">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
              <input type="text" value="${task.name || ''}" onchange="updateTaskField('${sec.id}', '${task.id}', 'name', this.value)" class="font-bold text-slate-900 bg-transparent flex-1 focus:bg-white rounded px-1">
              <div class="flex items-center gap-2 justify-end">
                <select onchange="updateTaskField('${sec.id}', '${task.id}', 'status', this.value)" class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${statusColors[currentStatus]}">
                  <option value="À faire" ${currentStatus === 'À faire' ? 'selected' : ''}>À faire</option>
                  <option value="En cours" ${currentStatus === 'En cours' ? 'selected' : ''}>En cours</option>
                  <option value="Validé" ${currentStatus === 'Validé' ? 'selected' : ''}>Validé</option>
                </select>
                <button onclick="deleteTask('${sec.id}', '${task.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>

            <div class="flex flex-wrap items-center gap-1.5 pt-1">

    }

    function addNewTask(secId) { const sec = appData.sections.find(s => s.id === secId); if(sec) { sec.tasks.push({ id: 'k_' + Date.now(), name: "Nouvelle tâche", resps: [], date: "", status: "À faire", notes: "" }); saveData(); renderActiveSection(); } }
    function updateTaskField(sId, tId, f, v) { 
      const s = appData.sections.find(x => x.id === sId); 
      const t = s?.tasks.find(x => x.id === tId); 
      if(t) { 
        t[f] = v; 
        saveData(); 
        if (f === 'status') renderActiveSection(); // Force UI refresh for select pill colors
      } 
    }
    function deleteTask(sId, tId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.tasks = s.tasks.filter(x => x.id !== tId); saveData(); renderActiveSection(); } }
    function addTaskAssignee(sId, tId, contactId) {
      if (!contactId) return;
      const s = appData.sections.find(x => x.id === sId);
      const t = s?.tasks.find(x => x.id === tId);
      if (t) {
        if (!t.resps) t.resps = [];
        if (!t.resps.includes(contactId)) {
          t.resps.push(contactId);
          saveData(); renderActiveSection();
        }
      }
    }
    function removeTaskAssignee(sId, tId, index) {
      const s = appData.sections.find(x => x.id === sId);
      const t = s?.tasks.find(x => x.id === tId);
      if (t && t.resps) {
        t.resps.splice(index, 1);
        saveData(); renderActiveSection();
      }
    }

    function addStickyNote(secId) { const sec = appData.sections.find(s => s.id === secId); if(sec) { sec.stickyNotes.push({ id: 'sn_' + Date.now(), title: "Nouvelle Note", content: "" }); saveData(); renderActiveSection(); } }
    function updateStickyNote(sId, nId, f, v) { const s = appData.sections.find(x => x.id === sId); const n = s?.stickyNotes.find(x => x.id === nId); if(n) { n[f] = v; saveData(); } }
    function deleteStickyNote(sId, nId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.stickyNotes = s.stickyNotes.filter(x => x.id !== nId); saveData(); renderActiveSection(); } }

    // --- AGENDA ---
    function generateAgendaHtml(sec) {
      let listHtml = '';
      sec.timeline.forEach((item) => {
        let selectOptions = `<option value="">-- Non assigné --</option>`;
        const available = getAvailableContactsForTask(sec.id);
        available.forEach(c => {
          selectOptions += `<option value="${c.id}" ${c.id === item.resp ? 'selected' : ''}>${c.name}</option>`;
        });

        listHtml += `
          <div class="flex flex-wrap items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
            <input type="time" value="${item.time || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'time', this.value)" class="w-24 font-bold text-emerald-700 bg-white border rounded p-1 text-center">
            <input type="text" placeholder="Activité" value="${item.activity || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'activity', this.value)" class="flex-1 min-w-[150px] font-medium bg-white border rounded p-1">
            <select onchange="updateAgendaItem('${sec.id}', '${item.id}', 'resp', this.value)" class="bg-white border rounded p-1 text-slate-700 min-w-[160px] cursor-pointer">${selectOptions}</select>
            <button onclick="deleteAgendaItem('${sec.id}', '${item.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
          </div>`;
      });
      return wrapModuleDraggable('mod_agenda', `<div class="border-b pb-3 mb-3 pr-6"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-clock text-rose-500"></i> Chronologie / Agenda (${sec.timeline.length})</h3></div><div class="space-y-2">${listHtml}</div>`);
    }
    function addAgendaSlot(secId) { const sec = appData.sections.find(s => s.id === secId); if(sec) { sec.timeline.push({ id: 't_' + Date.now(), time: "08:00", activity: "Nouvel événement", resp: "" }); saveData(); renderActiveSection(); } }
    function updateAgendaItem(sId, iId, f, v) { const s = appData.sections.find(x => x.id === sId); const i = s?.timeline.find(x => x.id === iId); if(i) { i[f] = v; saveData(); } }
    function deleteAgendaItem(sId, iId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.timeline = s.timeline.filter(x => x.id !== iId); saveData(); renderActiveSection(); } }

    // --- TABLEAUX NATIFS ---
    function generateTableHtml(sec, table) {
      if (!table.headers) table.headers = ["Col 1", "Col 2", "Col 3"];
      if (!table.rows) table.rows = [];

      let headersHtml = '';
      table.headers.forEach((h, colIndex) => {
        headersHtml += `<th class="p-0 border-r bg-slate-100 min-w-[120px]"><input type="text" value="${h || ''}" onchange="updateTableHeader('${sec.id}', '${table.id}', ${colIndex}, this.value)" class="cell-input w-full p-2.5 bg-transparent font-bold text-slate-700 text-xs"></th>`;
      });
      headersHtml += `<th class="w-10 bg-slate-100 border-l"></th>`;

      let rowsHtml = '';
      table.rows.forEach((row, rowIndex) => {
        if (!Array.isArray(row)) row = [];
        let cellsHtml = '';
        table.headers.forEach((_, colIndex) => {
          const cellVal = row[colIndex] !== undefined ? row[colIndex] : '';
          cellsHtml += `<td class="p-0 border-r border-b"><input type="text" value="${cellVal}" onchange="updateTableCell('${sec.id}', '${table.id}', ${rowIndex}, ${colIndex}, this.value)" class="cell-input w-full p-2.5 bg-transparent text-xs text-slate-800"></td>`;
        });
        cellsHtml += `<td class="p-0 border-b border-l text-center bg-slate-50"><button onclick="deleteTableRow('${sec.id}', '${table.id}', ${rowIndex})" class="text-slate-400 hover:text-rose-500 p-2"><i class="fa-solid fa-trash-can text-[10px]"></i></button></td>`;
        rowsHtml += `<tr class="hover:bg-slate-50">${cellsHtml}</tr>`;
      });

      return wrapModuleDraggable('tbl_' + table.id, `
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-3 pr-6 mb-4">
          <div class="flex-1 flex items-center gap-2">
            <i class="fa-solid fa-table text-emerald-600"></i>
            <input type="text" value="${table.title || ''}" placeholder="Titre du tableau..." onchange="updateTableTitle('${sec.id}', '${table.id}', this.value)" class="font-bold text-slate-800 text-sm bg-transparent focus:bg-slate-50 w-full sm:w-1/2 rounded px-1">
          </div>
          <div class="flex gap-2">
            <button onclick="addTableRow('${sec.id}', '${table.id}')" class="text-xs bg-slate-100 px-2.5 py-1.5 rounded-lg border">+ Ligne</button>
            <button onclick="addTableColumn('${sec.id}', '${table.id}')" class="text-xs bg-slate-100 px-2.5 py-1.5 rounded-lg border">+ Col</button>
            <button onclick="deleteTable('${sec.id}', '${table.id}')" class="text-xs text-slate-400 border px-2.5 py-1.5 rounded-lg hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
        <div class="w-full overflow-x-auto border border-slate-200 rounded-xl"><table class="w-full text-left border-collapse"><thead><tr>${headersHtml}</tr></thead><tbody>${rowsHtml}</tbody></table></div>
      `);
    }
    function addNativeTable(secId) { 
      const sec = appData.sections.find(s => s.id === secId); 
      if(sec) { 
        if(!sec.tables) sec.tables = [];
        sec.tables.push({ id: 'tbl_' + Date.now(), title: "Nouveau Tableau", headers: ["Col 1", "Col 2", "Col 3"], rows: [["", "", ""]] }); 
        saveData(); renderActiveSection(); 
      } 
    }
    function updateTableTitle(sId, tId, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t) { t.title = v; saveData(); } }
    function updateTableHeader(sId, tId, c, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t) { t.headers[c] = v; saveData(); } }
    function updateTableCell(sId, tId, r, c, v) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t && t.rows[r]) { 
        t.rows[r][c] = v; 
        saveData(); 
      } 
    }
    function addTableRow(sId, tId) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t) { 
        if(!t.rows) t.rows = [];
        t.rows.push(new Array(t.headers.length).fill("")); 
        saveData(); renderActiveSection(); 
      } 
    }
    function addTableColumn(sId, tId) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t) { 
        t.headers.push("Nouvelle"); 
        if(!t.rows) t.rows = [];
        t.rows.forEach(r => r.push("")); 
        saveData(); renderActiveSection(); 
      } 
    }
    function deleteTableRow(sId, tId, r) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t && t.rows) { 
        t.rows.splice(r, 1); 
        saveData(); renderActiveSection(); 
      } 
    }
    function deleteTable(sId, tId) { 
      const s = appData.sections.find(x => x.id === sId); 
      if(s) { 
        s.tables = (s.tables || []).filter(x => x.id !== tId); 
        s.layout = (s.layout || []).filter(id => id !== 'tbl_' + tId);
        saveData(); renderActiveSection(); 
      } 
    }

    // --- GOOGLE SHEETS ---
    function generateSheetHtml(sec, sheet) {
      const iframeUrl = sheet.url.includes('?') ? sheet.url + '&rm=minimal' : sheet.url + '?rm=minimal';
      return wrapModuleDraggable('sht_' + sheet.id, `
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-3 pr-6 mb-4">
          <div class="flex-1 flex items-center gap-2">
            <i class="fa-brands fa-google text-emerald-600"></i>
            <input type="text" value="${sheet.title || ''}" placeholder="Titre Google Sheets..." onchange="updateSheetTitle('${sec.id}', '${sheet.id}', this.value)" class="font-bold text-slate-800 text-sm bg-transparent focus:bg-slate-50 w-full sm:w-1/2 rounded px-1">
          </div>
          <div class="flex gap-2">
            <a href="${sheet.url}" target="_blank" class="text-xs bg-slate-100 px-2.5 py-1.5 rounded-lg border"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ouvrir</a>
            <button onclick="deleteSheet('${sec.id}', '${sheet.id}')" class="text-xs text-slate-400 border px-2.5 py-1.5 rounded-lg hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
        <div class="w-full h-[400px] border border-slate-200 rounded-xl overflow-hidden relative"><iframe src="${iframeUrl}" class="w-full h-full absolute inset-0"></iframe></div>
      `);
    }
    function updateSheetTitle(sId, shId, v) { const s = appData.sections.find(x => x.id === sId)?.sheets.find(x => x.id === shId); if(s) { s.title = v; saveData(); } }
    function deleteSheet(sId, shId) { 
      const s = appData.sections.find(x => x.id === sId); 
      if(s) { 
        s.sheets = (s.sheets || []).filter(x => x.id !== shId); 
        s.layout = (s.layout || []).filter(id => id !== 'sht_' + shId);
        saveData(); renderActiveSection(); 
      } 
    }

    // --- BÉNÉVOLES DE LA SECTION ---
    function generateLocalContactsHtml(sec) {
      let rows = '';
      sec.localContacts.forEach(c => {
        rows += `<tr class="border-b border-slate-100 last:border-none">
          <td class="p-2"><input type="text" value="${c.name || ''}" placeholder="Nom" onchange="updateLocalContactField('${sec.id}', '${c.id}', 'name', this.value)" class="bg-transparent w-full font-bold focus:bg-white rounded px-1 text-sm"></td>
          <td class="p-2"><input type="text" value="${c.emplacement || ''}" placeholder="Ex: Ravitaillement 1, Signaleur PK3..." onchange="updateLocalContactField('${sec.id}', '${c.id}', 'emplacement', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1 text-sm"></td>
          <td class="p-2"><input type="text" value="${c.phone || ''}" placeholder="Tél..." onchange="updateLocalContactField('${sec.id}', '${c.id}', 'phone', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1 text-sm"></td>
          <td class="p-2 text-right"><button onclick="deleteLocalContact('${sec.id}', '${c.id}')" class="text-slate-400 hover:text-rose-600 px-2"><i class="fa-solid fa-trash-can"></i></button></td>
        </tr>`;
      });

      let addOptions = `<option value="">+ Ajouter un bénévole depuis la liste...</option>`;
      addOptions += `<optgroup label="Carnet d'adresses (CSV)">`;
      const sortedCSV = [...IMPORTED_CSV_CONTACTS].sort((a,b) => a.name.localeCompare(b.name));
      sortedCSV.forEach((c, idx) => { addOptions += `<option value="csv_${idx}">${c.name}</option>`; });
      addOptions += `</optgroup>`;

      if (appData.contacts.length > 0) {
        addOptions += `<optgroup label="Contacts Événement">`;
        appData.contacts.forEach(c => { addOptions += `<option value="evt_${c.id}">${c.name}</option>`; });
        addOptions += `</optgroup>`;
      }

      return wrapModuleDraggable('mod_local_contacts', `
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-2 mb-3 pr-6">
          <h3 class="font-bold text-sm text-indigo-500 flex items-center gap-2"><i class="fa-solid fa-users"></i> Bénévoles de la Section</h3>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <select onchange="addLocalContactFromList('${sec.id}', this.value); this.value='';" class="bg-white border border-slate-300 rounded p-1.5 text-xs focus:border-indigo-500 outline-none w-full sm:w-64 cursor-pointer shadow-sm">
              ${addOptions}
            </select>
            <button onclick="addLocalContact('${sec.id}')" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1.5 rounded-lg border border-indigo-200 hover:bg-indigo-100 transition whitespace-nowrap">+ Créer à la main</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="text-slate-500 bg-slate-50 uppercase text-[10px]">
              <tr><th class="p-2">Nom</th><th class="p-2">Emplacement sur le parcours</th><th class="p-2">Tél / Email</th><th class="p-2 text-right">Action</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `);
    }
    
    function addLocalContactFromList(secId, val) {
      if (!val) return;
      const sec = appData.sections.find(x => x.id === secId);
      if(!sec) return;
      
      let name = "", phone = "";
      if (val.startsWith('csv_')) {
        const idx = parseInt(val.split('_')[1]);
        const c = IMPORTED_CSV_CONTACTS[idx];
        if(c) { name = c.name; phone = c.phone || c.email || ""; }
      } else if (val.startsWith('evt_')) {
        const id = val.replace('evt_', '');
        const c = appData.contacts.find(x => x.id === id);
        if(c) { name = c.name; phone = c.phone || c.email || ""; }
      }

      if (name) {
        if(!sec.localContacts) sec.localContacts = [];
        sec.localContacts.push({ id: 'lc_' + Date.now(), name: name, emplacement: "", phone: phone });
        saveData(); renderActiveSection();
      }
    }
    function addLocalContact(sId) { const s = appData.sections.find(x => x.id === sId); if(s) { if(!s.localContacts) s.localContacts = []; s.localContacts.push({ id: 'lc_' + Date.now(), name: "Nouveau Bénévole", emplacement: "", phone: ""}); saveData(); renderActiveSection(); } }
    function updateLocalContactField(sId, cId, f, v) { const c = appData.sections.find(x => x.id === sId)?.localContacts?.find(x => x.id === cId); if(c) { c[f] = v; saveData(); } }
    function deleteLocalContact(sId, cId) { 
      const s = appData.sections.find(x => x.id === sId); 
      if(s && s.localContacts) { 
        s.localContacts = s.localContacts.filter(x => x.id !== cId); 
        removeContactFromAllTasksAndAgendas(cId); // Nettoyage de sécurité
        saveData(); renderActiveSection(); 
      } 
    }


    // --- IMAGES & PIECES JOINTES ---
    function generateImagesHtml(sec) {
      let g = ''; (sec.images || []).forEach(img => g += `<div class="relative group aspect-video bg-slate-100 rounded-xl overflow-hidden"><img src="${img.dataUrl}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center gap-3"><button onclick="deleteImage('${sec.id}', '${img.id}')" class="bg-rose-500 text-white p-2 rounded-full"><i class="fa-solid fa-trash"></i></button></div></div>`);
      return wrapModuleDraggable('mod_images', `<div class="border-b pb-2 mb-3 pr-6"><h3 class="font-bold text-sm text-blue-500"><i class="fa-solid fa-image"></i> Images</h3></div><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${g}</div>`);
    }
    function uploadImage(e, sId) { 
      const f = e.target.files[0]; if(!f) return; 
      const r = new FileReader(); 
      r.onload = (ev) => { 
        const s = appData.sections.find(x => x.id === sId); 
        if(s) { 
          if(!s.images) s.images = []; 
          s.images.push({id: 'img_'+Date.now(), name: f.name, dataUrl: ev.target.result}); 
          saveData(); renderActiveSection(); 
        }
      }; 
      r.readAsDataURL(f);
      e.target.value = ''; // Purge file input
    }
    function deleteImage(sId, iId) { const s = appData.sections.find(x => x.id === sId); if(s && s.images) { s.images = s.images.filter(x => x.id !== iId); saveData(); renderActiveSection(); } }

    function generateAttachmentsHtml(sec) {
      let l = ''; (sec.attachments || []).forEach(att => l += `<div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg text-xs"><span>${att.name}</span> <button onclick="deleteAttachment('${sec.id}', '${att.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`);
      return wrapModuleDraggable('mod_attachments', `<div class="border-b pb-2 mb-3 pr-6"><h3 class="font-bold text-sm text-purple-500"><i class="fa-solid fa-paperclip"></i> Pièces Jointes</h3></div><div class="grid gap-2">${l}</div>`);
    }
    function uploadAttachment(e, sId) { 
      const f = e.target.files[0]; if(!f) return; 
      const r = new FileReader(); 
      r.onload = (ev) => { 
        const s = appData.sections.find(x => x.id === sId); 
        if(s) { 
          if(!s.attachments) s.attachments = []; 
          s.attachments.push({id: 'att_'+Date.now(), name: f.name, dataUrl: ev.target.result}); 
          saveData(); renderActiveSection(); 
        }
      }; 
      r.readAsDataURL(f); 
      e.target.value = ''; // Purge file input
    }
    function deleteAttachment(sId, aId) { const s = appData.sections.find(x => x.id === sId); if(s && s.attachments) { s.attachments = s.attachments.filter(x => x.id !== aId); saveData(); renderActiveSection(); } }


    // --- MODAL RECAPITULATIF CONTACT ---
    function openRecapModal() {
      const select = document.getElementById('recap-contact-select');
      select.innerHTML = '<option value="">-- Choisir un contact --</option>';
      
      const allContacts = [];
      appData.contacts.forEach(c => allContacts.push({id: c.id, name: c.name, type: 'Répertoire', info: c.org || ''}));
      appData.sections.forEach(s => {
        if(s.localContacts) s.localContacts.forEach(c => allContacts.push({id: c.id, name: c.name, type: `Bénévole (${s.title})`, info: c.emplacement || ''}));
      });

      const uniqueContacts = Array.from(new Map(allContacts.map(item => [item.id, item])).values());
      uniqueContacts.sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.name} - ${c.type}</option>`;
      });

      document.getElementById('recap-modal').classList.remove('hidden');
      document.getElementById('recap-modal').classList.add('flex');
      updateRecapView();
    }

    function closeRecapModal() {
      document.getElementById('recap-modal').classList.add('hidden');
      document.getElementById('recap-modal').classList.remove('flex');
    }

    function updateRecapView() {
      const contactId = document.getElementById('recap-contact-select').value;
      const contentArea = document.getElementById('recap-content-area');
      
      if (!contactId) {
        contentArea.innerHTML = '<div class="text-center text-slate-400 text-sm py-10 italic">Sélectionnez un contact pour voir ses missions.</div>';
        return;
      }

      let html = '';
      let missionCount = 0;

      appData.sections.forEach(sec => {
        const assignedTasks = (sec.tasks || []).filter(t => (t.resps || []).includes(contactId));
        const assignedTimeline = (sec.timeline || []).filter(t => t.resp === contactId);

        if (assignedTasks.length > 0 || assignedTimeline.length > 0) {
          html += `<div class="mb-4"><h4 class="font-bold text-sm text-slate-700 mb-2 border-b border-slate-200 pb-1">${sec.title}</h4>`;
          
          if (assignedTimeline.length > 0) {
            html += `<ul class="space-y-2 mb-3">`;
            assignedTimeline.forEach(t => {
              missionCount++;
              html += `<li class="flex items-center gap-3 bg-white p-2 rounded-lg border border-slate-200 shadow-sm text-xs"><span class="font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">${t.time || 'Heure non définie'}</span><span class="font-medium text-slate-800">${t.activity || 'Activité non définie'}</span></li>`;
            });
            html += `</ul>`;
          }

          if (assignedTasks.length > 0) {
            html += `<ul class="space-y-2">`;
            assignedTasks.forEach(t => {
              missionCount++;
              const color = t.status === 'Validé' ? 'text-emerald-600' : (t.status === 'En cours' ? 'text-amber-600' : 'text-slate-500');
              html += `<li class="flex flex-col sm:flex-row sm:items-center gap-2 bg-white p-3 rounded-lg border border-slate-200 shadow-sm text-xs"><div class="flex-1 font-medium text-slate-800"><i class="fa-solid fa-list-check text-slate-400 mr-2"></i>${t.name || 'Tâche sans nom'}</div><div class="font-bold ${color}">${t.status || 'À faire'}</div><div class="text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>${t.date || '-'}</div></li>`;
            });
            html += `</ul>`;
          }
          html += `</div>`;
        }
      });

      if (missionCount === 0) {
        html = `<div class="text-center text-slate-400 text-sm py-10 italic">Aucune tâche ni mission agenda assignée à ce contact.</div>`;
      }

      contentArea.innerHTML = html;
    }

    window.onload = initAppData;
  </script>
</body>
