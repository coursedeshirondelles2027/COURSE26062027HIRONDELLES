    const defaultData = {
      config: { title: "Course des Hirondelles 2027", date: "26 juin 2027", location: "Saint-Pierre-d'Irube" },
      contacts: [],
      sections: [
        { id: "sec-0", title: "Planning Jour J (Agenda)", icon: "fa-calendar-check", type: "agenda", layout: [], timeline: [], stickyNotes: [] },
        { id: "sec-1", title: "1. Course & Tracé", icon: "fa-map-location-dot", type: "trace_admin", layout: [], gpxTracks: [], tasks: [], stickyNotes: [] }
      ]
    };

    let appData = null;
    let activeSectionId = null;
    let leafletMaps = {};
    let draggedModuleId = null;
    let draggedSectionId = null;
    let globalSearchQuery = "";

    function initAppData() {
      eventRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) { appData = sanitizeData(data); } else { appData = defaultData; eventRef.set(appData); }
        if (!activeSectionId && appData.sections.length > 0) activeSectionId = appData.sections[0].id;
        renderSidebar(); renderActiveSection();
      });
    }

    function sanitizeData(data) {
      if (!data.config) data.config = { title: "Course des Hirondelles 2027", date: "26 juin 2027", location: "Saint-Pierre-d'Irube" };
      if (!data.sections) data.sections = [];
      if (!Array.isArray(data.sections)) data.sections = Object.values(data.sections);

      data.sections.forEach(sec => {
        if (!sec.layout) sec.layout = [];
        sec.layout = sec.layout.filter(id => id !== 'mod_notes'); 

        if (!sec.tables) sec.tables = []; else {
          sec.tables = Object.values(sec.tables);
          sec.tables.forEach(t => {
            if (!t.headers) t.headers = ["Col 1", "Col 2"];
            if (!t.rows) t.rows = [];
            t.rows = t.rows.map(r => {
              if (!Array.isArray(r)) r = [];
              while(r.length < t.headers.length) r.push("");
              return r.slice(0, t.headers.length);
            });
            if (!t.colColors) t.colColors = Array(t.headers.length).fill("#f8fafc");
            if (!Array.isArray(t.colColors)) t.colColors = Object.values(t.colColors);
            if (!t.rowColors) t.rowColors = Array(t.rows.length).fill("#ffffff");
            if (!Array.isArray(t.rowColors)) t.rowColors = Object.values(t.rowColors);
          });
        }
        if (!sec.tasks) sec.tasks = []; else { sec.tasks = Object.values(sec.tasks); sec.tasks.forEach(t => { if (!t.resps) { t.resps = t.resp ? [t.resp] : []; delete t.resp; }}); }
        if (!sec.stickyNotes) sec.stickyNotes = []; else sec.stickyNotes = Object.values(sec.stickyNotes);
        if (!sec.timeline) sec.timeline = []; else sec.timeline = Object.values(sec.timeline);
        if (!sec.sheets) sec.sheets = []; else sec.sheets = Object.values(sec.sheets);
        if (!sec.localContacts) sec.localContacts = []; else sec.localContacts = Object.values(sec.localContacts);
        if (!sec.images) sec.images = []; else sec.images = Object.values(sec.images);
        if (!sec.attachments) sec.attachments = []; else sec.attachments = Object.values(sec.attachments);
        if (!sec.gpxTracks) { sec.gpxTracks = []; } else { sec.gpxTracks = Object.values(sec.gpxTracks); }
      });

      if (!data.contacts) data.contacts = [];
      if (!Array.isArray(data.contacts)) data.contacts = Object.values(data.contacts);
      data.contacts = data.contacts.filter(c => !(c.id && c.id.startsWith('csv_')));

      return data;
    }

    function saveData(explicitNotification = false) {
      if (!appData) return;
      eventRef.set(appData).then(() => {
        const ind = document.getElementById('save-indicator');
        if (ind) ind.innerHTML = '<i class="fa-solid fa-check"></i> Synchronisé';
        if (explicitNotification) alert("Données enregistrées.");
      });
    }

    function updateConfigField(field, val) {
      appData.config[field] = val.trim();
      saveData();
    }

    function handleSectionDragStart(e, secId) {
      draggedSectionId = secId;
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleSectionDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    function handleSectionDrop(e, targetSecId) {
      e.preventDefault();
      if (!draggedSectionId || draggedSectionId === targetSecId) return;
      const oldIdx = appData.sections.findIndex(s => s.id === draggedSectionId);
      const newIdx = appData.sections.findIndex(s => s.id === targetSecId);
      if (oldIdx > -1 && newIdx > -1) {
        const [movedSec] = appData.sections.splice(oldIdx, 1);
        appData.sections.splice(newIdx, 0, movedSec);
        saveData();
        renderSidebar();
      }
    }

    function renderSidebar() {
      const container = document.getElementById('sidebar-sections-list');
      container.innerHTML = '';
      appData.sections.forEach((sec) => {
        const isActive = sec.id === activeSectionId;
        const item = document.createElement('div');
        item.draggable = true;
        item.ondragstart = (e) => handleSectionDragStart(e, sec.id);
        item.ondragover = handleSectionDragOver;
        item.ondrop = (e) => handleSectionDrop(e, sec.id);

        item.className = `flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium cursor-pointer transition-all ${isActive ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-100'}`;
        item.onclick = (e) => { 
          if(e.target.closest('.section-drag-handle')) return;
          activeSectionId = sec.id; renderSidebar(); renderActiveSection(); 
        };
        
        item.innerHTML = `
          <div class="flex items-center space-x-2 overflow-hidden">
            <span class="section-drag-handle opacity-50 hover:opacity-100 cursor-grab px-1" title="Glisser pour réorganiser la section"><i class="fa-solid fa-grip-vertical text-[10px]"></i></span>
            <i class="fa-solid ${sec.icon || 'fa-folder'} text-xs shrink-0"></i>
            <span class="truncate">${sec.title}</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // --- MOTEUR DE RECHERCHE GLOBAL AMÉLIORÉ ---
    function handleGlobalSearch(query) {
      globalSearchQuery = query.trim().toLowerCase();
      renderActiveSection();
    }

    function matchSearch(text) {
      if (!globalSearchQuery) return true;
      return (text || '').toLowerCase().includes(globalSearchQuery);
    }

    function handleModuleDragStart(e, moduleId) { draggedModuleId = moduleId; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => e.target.classList.add('module-dragging'), 0); }
    function handleModuleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('module-drag-over'); }
    function handleModuleDragLeave(e) { e.currentTarget.classList.remove('module-drag-over'); }
    function handleModuleDrop(e, targetModuleId) {
      e.preventDefault(); e.currentTarget.classList.remove('module-drag-over');
      if (!draggedModuleId || draggedModuleId === targetModuleId) return;
      const sec = appData.sections.find(s => s.id === activeSectionId);
      if (!sec) return;
      const oldIndex = sec.layout.indexOf(draggedModuleId);
      const newIndex = sec.layout.indexOf(targetModuleId);
      if (oldIndex > -1 && newIndex > -1) { sec.layout.splice(oldIndex, 1); sec.layout.splice(newIndex, 0, draggedModuleId); saveData(); renderActiveSection(); }
    }
    function handleModuleDragEnd(e) { if (e.target) e.target.classList.remove('module-dragging'); draggedModuleId = null; }

    function wrapModuleDraggable(moduleId, contentHtml, isSingle = false) {
      const spanClass = isSingle ? "col-span-1 xl:col-span-2" : "col-span-1";
      return `
        <div draggable="true" 
             ondragstart="handleModuleDragStart(event, '${moduleId}')" 
             ondragover="handleModuleDragOver(event)" 
             ondragleave="handleModuleDragLeave(event)" 
             ondrop="handleModuleDrop(event, '${moduleId}')" 
             ondragend="handleModuleDragEnd(event)" 
             class="${spanClass} bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative group transition-all h-full flex flex-col">
          <div class="absolute top-2 right-2 module-drag-handle text-slate-300 hover:text-emerald-500 p-1 bg-white rounded cursor-move z-10" title="Glisser pour réorganiser">
            <i class="fa-solid fa-grip"></i>
          </div>
          <div class="flex-1 flex flex-col">
            ${contentHtml}
          </div>
        </div>
      `;
    }

    function renderActiveSection() {
      const container = document.getElementById('main-content-viewport');
      const sec = appData.sections.find(s => s.id === activeSectionId);
      if (!sec) return;

      container.innerHTML = '';

      const headerBox = document.createElement('div');
      headerBox.className = 'bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col gap-4';
      headerBox.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-slate-900 flex items-center gap-3">
            <span contenteditable="true" onblur="updateSectionTitle('${sec.id}', this.innerText)" class="outline-none hover:bg-slate-50 rounded px-1" title="Cliquer pour modifier">${sec.title}</span>
            <button onclick="deleteSection('${sec.id}')" class="text-slate-300 hover:text-rose-600 transition" title="Supprimer"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </h2>
        </div>
        
        <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-100">
          <span class="text-[10px] font-bold uppercase text-slate-400 mr-2 tracking-wider"><i class="fa-solid fa-toolbox"></i> Ajouter :</span>
          <button onclick="addNewTask('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-emerald-50 hover:text-emerald-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-list-check"></i> Tâche</button>
          <button onclick="addStickyNote('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-amber-50 hover:text-amber-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-note-sticky"></i> Note</button>
          <button onclick="addLocalContact('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-user-plus"></i> Bénévoles / Staff</button>
          <button onclick="addNativeTable('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-green-50 hover:text-green-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-table"></i> Tableau Intégré</button>
          <label class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-blue-50 hover:text-blue-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition cursor-pointer"><i class="fa-solid fa-image"></i> Image<input type="file" accept="image/*" onchange="uploadImage(event, '${sec.id}')" class="hidden"></label>
          <label class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-purple-50 hover:text-purple-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition cursor-pointer"><i class="fa-solid fa-paperclip"></i> Pièce Jointe<input type="file" onchange="uploadAttachment(event, '${sec.id}')" class="hidden"></label>
          <button onclick="addAgendaSlot('${sec.id}')" class="text-[11px] font-semibold text-slate-700 bg-slate-50 border border-slate-200 hover:bg-rose-50 hover:text-rose-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition"><i class="fa-solid fa-clock"></i> Planning</button>
        </div>
      `;
      container.appendChild(headerBox);

      const flexContainer = document.createElement('div');
      flexContainer.className = "flex flex-col lg:flex-row gap-6 items-start w-full";

      const mainGrid = document.createElement('div');
      mainGrid.className = "flex-1 grid grid-cols-1 xl:grid-cols-2 gap-6 content-start min-w-0 w-full";

      const notesSidebar = document.createElement('div');
      notesSidebar.className = "w-full lg:w-[350px] shrink-0 lg:sticky lg:top-24 z-10"; 

      const renderedModules = {};
      
      if (sec.type === 'trace_admin') renderedModules['mod_map'] = generateMapModuleHtml(sec);
      if (sec.type === 'contacts') renderedModules['mod_global_contacts'] = generateGlobalContactsHtml();

      sec.tables.forEach(t => {
        const tHtml = generateTableHtml(sec, t);
        if (!globalSearchQuery || matchSearch(t.title) || tHtml.toLowerCase().includes(globalSearchQuery)) {
          renderedModules['tbl_' + t.id] = tHtml;
        }
      });
      sec.sheets.forEach(s => {
        if (!globalSearchQuery || matchSearch(s.title)) {
          renderedModules['sht_' + s.id] = generateSheetHtml(sec, s);
        }
      });
      if (sec.timeline.length > 0) {
        const tHtml = generateAgendaHtml(sec);
        if (!globalSearchQuery || tHtml.toLowerCase().includes(globalSearchQuery)) renderedModules['mod_agenda'] = tHtml;
      }
      if (sec.tasks.length > 0) {
        const tHtml = generateTasksHtml(sec);
        if (!globalSearchQuery || tHtml.toLowerCase().includes(globalSearchQuery)) renderedModules['mod_tasks'] = tHtml;
      }
      if (sec.localContacts.length > 0) {
        const tHtml = generateLocalContactsHtml(sec);
        if (!globalSearchQuery || tHtml.toLowerCase().includes(globalSearchQuery)) renderedModules['mod_local_contacts'] = tHtml;
      }
      if (sec.images.length > 0) {
        const imgHtml = generateImagesHtml(sec);
        if (!globalSearchQuery || imgHtml.toLowerCase().includes(globalSearchQuery)) {
          renderedModules['mod_images'] = imgHtml;
        }
      }
      if (sec.attachments.length > 0) {
        const attHtml = generateAttachmentsHtml(sec);
        if (!globalSearchQuery || attHtml.toLowerCase().includes(globalSearchQuery)) {
          renderedModules['mod_attachments'] = attHtml;
        }
      }

      const actualModuleIds = Object.keys(renderedModules);
      actualModuleIds.forEach(id => { if (!sec.layout.includes(id)) sec.layout.push(id); });
      sec.layout = sec.layout.filter(id => actualModuleIds.includes(id));

      const isSingleModule = sec.layout.length === 1;

      sec.layout.forEach(id => {
        if (renderedModules[id]) {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = wrapModuleDraggable(id, renderedModules[id].replace(/^<div[^>]*>|<\/div>$/g, ''), isSingleModule);
          mainGrid.appendChild(wrapper.firstElementChild);
        }
      });
      flexContainer.appendChild(mainGrid);

      const filteredNotes = (sec.stickyNotes || []).filter(n => !globalSearchQuery || matchSearch(n.title) || matchSearch(n.content));
      if (filteredNotes.length > 0 || !globalSearchQuery) {
        notesSidebar.innerHTML = generateStickyNotesSidebarHtml(sec, filteredNotes);
        flexContainer.appendChild(notesSidebar);
      }

      container.appendChild(flexContainer);

      if (sec.type === 'trace_admin') setTimeout(() => initMap(sec), 150);
    }

    function updateSectionTitle(secId, newTitle) {
      const sec = appData.sections.find(s => s.id === secId);
      if (sec && newTitle.trim() !== "") { sec.title = newTitle.trim(); saveData(); renderSidebar(); }
    }
    function deleteSection(secId) {
      const sec = appData.sections.find(s => s.id === secId);
      if (confirm(`Supprimer la section "${sec.title}" et son contenu ?`)) {
        appData.sections = appData.sections.filter(s => s.id !== secId);
        activeSectionId = appData.sections.length > 0 ? appData.sections[0].id : null;
        saveData(); renderSidebar();
        if (activeSectionId) renderActiveSection(); else document.getElementById('main-content-viewport').innerHTML = '';
      }
    }
    function addNewCustomSectionPrompt() {
      const title = prompt("Nom de la nouvelle section :");
      if (title) {
        const newId = 'sec_' + Date.now();
        appData.sections.push({ id: newId, title: title, type: "standard", layout: [], tasks: [], stickyNotes: [], timeline: [], sheets: [], tables: [], localContacts: [], images: [], attachments: [], gpxTracks: [] });
        if (!activeSectionId) activeSectionId = newId;
        saveData(); renderSidebar(); renderActiveSection();
      }
    }

    function removeContactFromAllTasksAndAgendas(contactId) {
      appData.sections.forEach(s => {
        if (s.tasks) s.tasks.forEach(t => { if (t.resps && t.resps.includes(contactId)) t.resps = t.resps.filter(id => id !== contactId); });
        if (s.timeline) s.timeline.forEach(t => { if (t.resp === contactId) t.resp = ""; });
      });
    }

    function generateStickyNotesSidebarHtml(sec, notesToDisplay) {
      let listHtml = '';
      notesToDisplay.forEach(note => {
        listHtml += `
          <div class="p-4 bg-amber-50 border-l-4 border-amber-400 shadow-sm rounded-r-xl space-y-2 relative group mb-4">
            <button onclick="deleteStickyNote('${sec.id}', '${note.id}')" class="absolute top-2 right-2 text-amber-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-xmark"></i></button>
            <input type="text" value="${note.title || ''}" placeholder="Titre..." onchange="updateStickyNote('${sec.id}', '${note.id}', 'title', this.value)" class="font-bold text-amber-900 bg-transparent w-full focus:bg-white rounded text-sm outline-none px-1">
            <textarea placeholder="Contenu..." onchange="updateStickyNote('${sec.id}', '${note.id}', 'content', this.value)" class="w-full text-amber-800 text-sm bg-transparent border-none resize-none focus:bg-white rounded min-h-[100px] outline-none p-1">${note.content || ''}</textarea>
          </div>`;
      });
      return `
        <div class="bg-white p-5 rounded-2xl border border-amber-200 shadow-sm relative transition-all flex flex-col h-[calc(100vh-140px)]">
          <div class="border-b border-amber-100 pb-3 mb-4 flex items-center justify-between shrink-0">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-note-sticky text-amber-500"></i> Pense-Bêtes (${sec.stickyNotes.length})</h3>
            <button onclick="addStickyNote('${sec.id}')" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-1 rounded font-semibold transition">+ Note</button>
          </div>
          <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
            ${listHtml}
          </div>
        </div>
      `;
    }
    function addStickyNote(secId) { const sec = appData.sections.find(s => s.id === secId); if(sec) { sec.stickyNotes.push({ id: 'sn_' + Date.now(), title: "Nouvelle Note", content: "" }); saveData(); renderActiveSection(); } }
    function updateStickyNote(sId, nId, f, v) { const s = appData.sections.find(x => x.id === sId); const n = s?.stickyNotes.find(x => x.id === nId); if(n) { n[f] = v; saveData(); } }
    function deleteStickyNote(sId, nId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.stickyNotes = s.stickyNotes.filter(x => x.id !== nId); saveData(); renderActiveSection(); } }

    function generateTableHtml(sec, table) {
      if (!table.headers) table.headers = ["Col 1", "Col 2"];
      if (!table.rows) table.rows = [];
      if (!table.colColors) table.colColors = Array(table.headers.length).fill("#f8fafc");
      if (!table.rowColors) table.rowColors = Array(table.rows.length).fill("#ffffff");

      let headersHtml = '';
      table.headers.forEach((h, colIndex) => {
        const cColor = table.colColors[colIndex] || '#f8fafc';
        headersHtml += `<th class="p-0 border-r min-w-[120px]" style="background-color: ${cColor};">
          <div class="flex items-center justify-between p-1 px-2">
            <input type="text" value="${h || ''}" onchange="updateTableHeader('${sec.id}', '${table.id}', ${colIndex}, this.value)" class="cell-input w-full bg-transparent font-bold text-slate-700 text-xs outline-none">
            <div class="flex items-center gap-1 shrink-0">
              <input type="color" value="${cColor}" onchange="updateTableColColor('${sec.id}', '${table.id}', ${colIndex}, this.value)" class="w-4 h-4 p-0 border-0 cursor-pointer rounded color-picker-custom" title="Couleur Colonne">
              <button onclick="deleteTableColumn('${sec.id}', '${table.id}', ${colIndex})" class="text-slate-400 hover:text-rose-600 px-1 text-[10px]" title="Supprimer cette colonne"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
        </th>`;
      });
      headersHtml += `<th class="w-16 bg-slate-100 border-l"></th>`;

      let rowsHtml = '';
      table.rows.forEach((row, rowIndex) => {
        if (!Array.isArray(row)) row = [];
        let cellsHtml = '';
        const rColor = table.rowColors[rowIndex] || '#ffffff';
        
        table.headers.forEach((_, colIndex) => {
          const cellVal = row[colIndex] !== undefined ? row[colIndex] : '';
          const cColor = table.colColors[colIndex] || '#f8fafc';
          const cellBg = (rColor !== '#ffffff') ? rColor : (cColor !== '#f8fafc' ? cColor : 'transparent');
          
          cellsHtml += `<td class="p-0 border-r border-b transition-colors" style="background-color: ${cellBg};">
            <input type="text" value="${cellVal}" onchange="updateTableCell('${sec.id}', '${table.id}', ${rowIndex}, ${colIndex}, this.value)" class="cell-input w-full p-2.5 bg-transparent text-xs text-slate-800 outline-none">
          </td>`;
        });
        
        cellsHtml += `<td class="p-0 border-b border-l bg-slate-50 w-16">
          <div class="flex items-center justify-center gap-2 h-full py-2">
            <input type="color" value="${rColor}" onchange="updateTableRowColor('${sec.id}', '${table.id}', ${rowIndex}, this.value)" class="w-4 h-4 p-0 border-0 cursor-pointer shrink-0 rounded color-picker-custom" title="Couleur Ligne">
            <button onclick="deleteTableRow('${sec.id}', '${table.id}', ${rowIndex})" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
          </div>
        </td>`;
        
        rowsHtml += `<tr class="hover:opacity-90 transition-opacity">${cellsHtml}</tr>`;
      });

      return `
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-3 pr-6 mb-4">
          <div class="flex-1 flex items-center gap-2">
            <i class="fa-solid fa-table text-emerald-600"></i>
            <input type="text" value="${table.title || ''}" placeholder="Titre du tableau..." onchange="updateTableTitle('${sec.id}', '${table.id}', this.value)" class="font-bold text-slate-800 text-sm bg-transparent focus:bg-slate-50 w-full sm:w-1/2 rounded px-1">
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="addTableRow('${sec.id}', '${table.id}')" class="text-xs bg-slate-100 px-2.5 py-1.5 rounded-lg border hover:bg-slate-200">+ Ligne</button>
            <button onclick="addTableColumn('${sec.id}', '${table.id}')" class="text-xs bg-slate-100 px-2.5 py-1.5 rounded-lg border hover:bg-slate-200">+ Col</button>
            <button onclick="deleteTable('${sec.id}', '${table.id}')" class="text-xs text-slate-400 border px-2.5 py-1.5 rounded-lg hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>
        <div class="w-full overflow-x-auto border border-slate-200 rounded-xl">
          <table class="w-full text-left border-collapse">
            <thead><tr>${headersHtml}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    }
    
    function addNativeTable(secId) { 
      const sec = appData.sections.find(s => s.id === secId); 
      if(sec) { 
        let colCountInput = prompt("Combien de colonnes souhaitez-vous créer ? (ex: 2)", "2");
        if (colCountInput === null) return; 
        
        let colCount = parseInt(colCountInput);
        if (isNaN(colCount) || colCount < 1) colCount = 2;

        const headers = Array.from({ length: colCount }, (_, i) => `Col ${i + 1}`);
        const initialRow = Array(colCount).fill("");

        if(!sec.tables) sec.tables = [];
        sec.tables.push({ 
          id: 'tbl_' + Date.now(), 
          title: "Nouveau Tableau", 
          headers: headers, 
          rows: [initialRow],
          colColors: Array(colCount).fill("#f8fafc"),
          rowColors: ["#ffffff"]
        }); 
        saveData(); renderActiveSection(); 
      } 
    }

    function updateTableTitle(sId, tId, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t) { t.title = v; saveData(); } }
    function updateTableHeader(sId, tId, c, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t) { t.headers[c] = v; saveData(); } }
    function updateTableCell(sId, tId, r, c, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t && t.rows[r]) { t.rows[r][c] = v; saveData(); } }
    function updateTableColColor(sId, tId, c, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t) { t.colColors[c] = v; saveData(); renderActiveSection(); } }
    function updateTableRowColor(sId, tId, r, v) { const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); if(t) { t.rowColors[r] = v; saveData(); renderActiveSection(); } }

    function addTableRow(sId, tId) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t) { t.rows.push(new Array(t.headers.length).fill("")); t.rowColors.push("#ffffff"); saveData(); renderActiveSection(); } 
    }
    function addTableColumn(sId, tId) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t) { t.headers.push("Nouvelle"); t.rows.forEach(r => r.push("")); t.colColors.push("#f8fafc"); saveData(); renderActiveSection(); } 
    }
    function deleteTableColumn(sId, tId, colIndex) {
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId);
      if (t) {
        if (t.headers.length <= 1) { alert("Impossible de supprimer la dernière colonne."); return; }
        t.headers.splice(colIndex, 1);
        t.colColors.splice(colIndex, 1);
        t.rows.forEach(r => r.splice(colIndex, 1));
        saveData(); renderActiveSection();
      }
    }
    function deleteTableRow(sId, tId, r) { 
      const t = appData.sections.find(x => x.id === sId)?.tables.find(x => x.id === tId); 
      if(t && t.rows) { t.rows.splice(r, 1); t.rowColors.splice(r, 1); saveData(); renderActiveSection(); } 
    }
    function deleteTable(sId, tId) { 
      const s = appData.sections.find(x => x.id === sId); 
      if(s) { s.tables = s.tables.filter(x => x.id !== tId); s.layout = s.layout.filter(id => id !== 'tbl_' + tId); saveData(); renderActiveSection(); } 
    }

    function generateMapModuleHtml(sec) {
      let mapsHtml = '';
      if (sec.gpxTracks.length === 0) { mapsHtml = `<div class="text-xs text-slate-400 italic mb-4">Aucun fichier GPX chargé.</div>`; } else {
        sec.gpxTracks.forEach(trk => {
          mapsHtml += `<div class="mb-5 border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white relative z-0"><div class="flex justify-between items-center bg-slate-50 p-2 border-b border-slate-200"><span class="font-bold text-emerald-700 text-xs"><i class="fa-solid fa-route mr-1"></i> ${trk.name}</span><button onclick="deleteGPXTrack('${sec.id}', '${trk.id}')" class="text-rose-500 hover:text-rose-700 px-2 py-1"><i class="fa-solid fa-trash-can"></i></button></div><div id="map-${trk.id}" class="leaflet-map-container"></div></div>`;
        });
      }
      return `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3 mb-4 pr-6">
          <div><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-map text-emerald-600"></i> Cartes des Tracés (GPX)</h3></div>
          <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1.5 transition"><i class="fa-solid fa-file-code"></i> Ajouter un GPX<input type="file" multiple onchange="handleGPXUpload(event, '${sec.id}')" accept=".gpx" class="hidden"></label>
        </div>
        ${mapsHtml}
      `;
    }
    function handleGPXUpload(event, secId) { const files = event.target.files; if (!files || files.length === 0) return; const sec = appData.sections.find(s => s.id === secId); if (!sec) return; Array.from(files).forEach(file => { const reader = new FileReader(); reader.onload = function(e) { sec.gpxTracks.push({ id: 'gpx_' + Date.now() + Math.random(), name: file.name, data: e.target.result }); saveData(); renderActiveSection(); }; reader.readAsText(file); }); event.target.value = ''; }
    function deleteGPXTrack(secId, trackId) { const sec = appData.sections.find(s => s.id === secId); if (sec) { sec.gpxTracks = sec.gpxTracks.filter(t => t.id !== trackId); saveData(); renderActiveSection(); } }
    function initMap(sec) { Object.values(leafletMaps).forEach(m => m.remove()); leafletMaps = {}; sec.gpxTracks.forEach((trk) => { const mapContainerId = 'map-' + trk.id; const container = document.getElementById(mapContainerId); if (!container) return; const map = L.map(mapContainerId).setView([43.4633, -1.4519], 13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map); const parser = new DOMParser(); const xmlDoc = parser.parseFromString(trk.data, "text/xml"); const points = []; xmlDoc.querySelectorAll("trkpt, wpt, rtept").forEach(pt => { const lat = parseFloat(pt.getAttribute("lat")); const lon = parseFloat(pt.getAttribute("lon")); if (!isNaN(lat) && !isNaN(lon)) points.push([lat, lon]); }); if (points.length > 0) { const polyline = L.polyline(points, { color: '#16a34a', weight: 4 }).addTo(map); map.fitBounds(polyline.getBounds(), { padding: [20, 20] }); } leafletMaps[trk.id] = map; }); }

    function generateGlobalContactsHtml() {
      let rows = ''; appData.contacts.forEach(c => { rows += `<tr class="border-b border-slate-100 last:border-none"><td class="p-2"><input type="text" value="${c.name || ''}" onchange="updateGlobalContactField('${c.id}', 'name', this.value)" class="bg-transparent font-bold w-full focus:bg-white rounded px-1 text-xs"></td><td class="p-2"><input type="text" value="${c.org || ''}" onchange="updateGlobalContactField('${c.id}', 'org', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1 text-xs"></td><td class="p-2"><input type="text" value="${c.phone || ''}" onchange="updateGlobalContactField('${c.id}', 'phone', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1 text-xs"></td><td class="p-2 text-right"><button onclick="deleteGlobalContact('${c.id}')" class="text-slate-400 hover:text-rose-600 px-2"><i class="fa-solid fa-trash-can"></i></button></td></tr>`; });
      let addOptions = `<option value="">+ Depuis la base (CSV)...</option>`;
      [...IMPORTED_CSV_CONTACTS].sort((a,b) => a.name.localeCompare(b.name)).forEach((c, idx) => { addOptions += `<option value="${idx}">${c.name}</option>`; });
      return `
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-3 pr-6"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-address-book text-emerald-600"></i> Contacts (${appData.contacts.length})</h3><div class="flex gap-2"><select onchange="addGlobalContactFromCSV(this.value); this.value='';" class="bg-white border rounded p-1.5 text-xs">${addOptions}</select><button onclick="addGlobalContact()" class="text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1.5 rounded-lg border">+ Nouveau</button></div></div>
        <div class="overflow-x-auto mt-4"><table class="w-full text-left text-xs"><thead class="bg-slate-50 text-slate-500 uppercase text-[10px]"><tr><th class="p-2">Nom</th><th class="p-2">Entité</th><th class="p-2">Téléphone</th><th class="p-2 text-right">Action</th></tr></thead><tbody>${rows}</tbody></table></div>
      `;
    }
    function addGlobalContactFromCSV(idx) { if(idx === "") return; const csvContact = IMPORTED_CSV_CONTACTS[idx]; if(csvContact) { appData.contacts.push({ id: 'c_' + Date.now() + Math.random(), name: csvContact.name, org: "", phone: csvContact.phone, email: csvContact.email }); saveData(); renderActiveSection(); } }
    function addGlobalContact() { appData.contacts.push({ id: 'c_' + Date.now(), name: "Nouveau Contact", org: "", phone: "", email: "" }); saveData(); renderActiveSection(); }
    function updateGlobalContactField(cId, f, v) { const c = appData.contacts.find(x => x.id === cId); if (c) { c[f] = v; saveData(); } }
    function deleteGlobalContact(cId) { appData.contacts = appData.contacts.filter(x => x.id !== cId); removeContactFromAllTasksAndAgendas(cId); saveData(); renderActiveSection(); }

    function getAvailableContactsForTask(secId) { let list = []; const sec = appData.sections.find(s => s.id === secId); if (sec && sec.localContacts) sec.localContacts.forEach(c => list.push({ id: c.id, name: c.name + ' (Section)' })); if (appData.contacts) appData.contacts.forEach(c => list.push({ id: c.id, name: c.name + ' (Général)' })); return list.sort((a,b) => a.name.localeCompare(b.name)); }

    function generateTasksHtml(sec) {
      let listHtml = '';
      sec.tasks.forEach(task => {
        if (!task.resps) task.resps = [];
        const statusColors = { 'À faire': 'bg-slate-200 text-slate-700', 'En cours': 'bg-amber-100 text-amber-800', 'Validé': 'bg-emerald-100 text-emerald-800' };
        let assigneesHtml = '';
        task.resps.forEach((respId, rIdx) => {
          const localC = sec.localContacts?.find(x => x.id === respId); const globalC = appData.contacts?.find(x => x.id === respId); const contactName = localC ? localC.name : (globalC ? globalC.name : "Inconnu");
          assigneesHtml += `<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-md text-[11px] font-medium"><i class="fa-solid fa-user text-[10px]"></i> ${contactName} <button onclick="removeTaskAssignee('${sec.id}', '${task.id}', ${rIdx})" class="text-emerald-400 hover:text-rose-600"><i class="fa-solid fa-xmark"></i></button></span>`;
        });
        let selectOptions = `<option value="">+ Assigner...</option>`;
        getAvailableContactsForTask(sec.id).forEach(c => { if (!task.resps.includes(c.id)) selectOptions += `<option value="${c.id}">${c.name}</option>`; });
        
        listHtml += `<div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs"><div class="flex justify-between items-center gap-2"><input type="text" value="${task.name || ''}" onchange="updateTaskField('${sec.id}', '${task.id}', 'name', this.value)" class="font-bold text-slate-900 bg-transparent flex-1 focus:bg-white rounded px-1"><div class="flex gap-2"><select onchange="updateTaskField('${sec.id}', '${task.id}', 'status', this.value)" class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${statusColors[task.status || 'À faire']}"><option value="À faire" ${(task.status||'À faire') === 'À faire' ? 'selected' : ''}>À faire</option><option value="En cours" ${task.status === 'En cours' ? 'selected' : ''}>En cours</option><option value="Validé" ${task.status === 'Validé' ? 'selected' : ''}>Validé</option></select><button onclick="deleteTask('${sec.id}', '${task.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button></div></div><div class="flex flex-wrap items-center gap-1.5 pt-1">${assigneesHtml}<select onchange="addTaskAssignee('${sec.id}', '${task.id}', this.value); this.value='';" class="bg-white border rounded px-1 py-0.5 outline-none">${selectOptions}</select></div></div>`;
      });
      return `
        <div class="border-b pb-3 mb-3 pr-6"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-list-check text-emerald-600"></i> Tâches (${sec.tasks.length})</h3></div>
        <div class="space-y-3">${listHtml}</div>
      `;
    }
    function addNewTask(secId) { const sec = appData.sections.find(s => s.id === secId); if(sec) { sec.tasks.push({ id: 'k_' + Date.now(), name: "Nouvelle tâche", resps: [], date: "", status: "À faire", notes: "" }); saveData(); renderActiveSection(); } }
    function updateTaskField(sId, tId, f, v) { const s = appData.sections.find(x => x.id === sId); const t = s?.tasks.find(x => x.id === tId); if(t) { t[f] = v; saveData(); if(f==='status') renderActiveSection(); } }
    function deleteTask(sId, tId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.tasks = s.tasks.filter(x => x.id !== tId); saveData(); renderActiveSection(); } }
    function addTaskAssignee(sId, tId, contactId) { if (!contactId) return; const t = appData.sections.find(x => x.id === sId)?.tasks.find(x => x.id === tId); if (t) { if (!t.resps) t.resps = []; if (!t.resps.includes(contactId)) { t.resps.push(contactId); saveData(); renderActiveSection(); } } }
    function removeTaskAssignee(sId, tId, index) { const t = appData.sections.find(x => x.id === sId)?.tasks.find(x => x.id === tId); if (t && t.resps) { t.resps.splice(index, 1); saveData(); renderActiveSection(); } }

    function generateAgendaHtml(sec) {
      let listHtml = '';
      sec.timeline.forEach((item) => {
        let selectOptions = `<option value="">-- Non assigné --</option>`;
        getAvailableContactsForTask(sec.id).forEach(c => { selectOptions += `<option value="${c.id}" ${c.id === item.resp ? 'selected' : ''}>${c.name}</option>`; });
        listHtml += `<div class="flex flex-wrap items-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs"><input type="time" value="${item.time || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'time', this.value)" class="w-20 font-bold text-emerald-700 bg-white border rounded p-1 text-center"><input type="text" placeholder="Activité" value="${item.activity || ''}" onchange="updateAgendaItem('${sec.id}', '${item.id}', 'activity', this.value)" class="flex-1 min-w-[120px] font-medium bg-white border rounded p-1"><select onchange="updateAgendaItem('${sec.id}', '${item.id}', 'resp', this.value)" class="bg-white border rounded p-1 text-slate-700 min-w-[140px]">${selectOptions}</select><button onclick="deleteAgendaItem('${sec.id}', '${item.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button></div>`;
      });
      return `
        <div class="border-b pb-3 mb-3 pr-6"><h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="fa-solid fa-clock text-rose-500"></i> Chronologie (${sec.timeline.length})</h3></div>
        <div class="space-y-2">${listHtml}</div>
      `;
    }
    function addAgendaSlot(secId) { const sec = appData.sections.find(s => s.id === secId); if(sec) { sec.timeline.push({ id: 't_' + Date.now(), time: "08:00", activity: "Nouvel événement", resp: "" }); saveData(); renderActiveSection(); } }
    function updateAgendaItem(sId, iId, f, v) { const i = appData.sections.find(x => x.id === sId)?.timeline.find(x => x.id === iId); if(i) { i[f] = v; saveData(); } }
    function deleteAgendaItem(sId, iId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.timeline = s.timeline.filter(x => x.id !== iId); saveData(); renderActiveSection(); } }

    function generateSheetHtml(sec, sheet) { 
      const iframeUrl = sheet.url.includes('?') ? sheet.url + '&rm=minimal' : sheet.url + '?rm=minimal'; 
      return `
        <div class="flex justify-between items-center border-b pb-3 pr-6 mb-4"><div class="flex-1 flex items-center gap-2"><i class="fa-brands fa-google text-emerald-600"></i><input type="text" value="${sheet.title || ''}" onchange="updateSheetTitle('${sec.id}', '${sheet.id}', this.value)" class="font-bold text-sm bg-transparent focus:bg-slate-50 w-full rounded"></div><button onclick="deleteSheet('${sec.id}', '${sheet.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button></div>
        <div class="w-full h-[400px] border rounded-xl overflow-hidden relative"><iframe src="${iframeUrl}" class="w-full h-full absolute inset-0"></iframe></div>
      `; 
    }
    function updateSheetTitle(sId, shId, v) { const s = appData.sections.find(x => x.id === sId)?.sheets.find(x => x.id === shId); if(s) { s.title = v; saveData(); } }
    function deleteSheet(sId, shId) { const s = appData.sections.find(x => x.id === sId); if(s) { s.sheets = s.sheets.filter(x => x.id !== shId); s.layout = s.layout.filter(id => id !== 'sht_' + shId); saveData(); renderActiveSection(); } }

    function generateLocalContactsHtml(sec) {
      let rows = ''; sec.localContacts.forEach(c => { rows += `<tr class="border-b border-slate-100 last:border-none"><td class="p-2"><input type="text" value="${c.name || ''}" onchange="updateLocalContactField('${sec.id}', '${c.id}', 'name', this.value)" class="bg-transparent w-full font-bold focus:bg-white rounded px-1 text-xs"></td><td class="p-2"><input type="text" value="${c.emplacement || ''}" onchange="updateLocalContactField('${sec.id}', '${c.id}', 'emplacement', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1 text-xs"></td><td class="p-2"><input type="text" value="${c.phone || ''}" onchange="updateLocalContactField('${sec.id}', '${c.id}', 'phone', this.value)" class="bg-transparent w-full focus:bg-white rounded px-1 text-xs"></td><td class="p-2 text-right"><button onclick="deleteLocalContact('${sec.id}', '${c.id}')" class="text-slate-400 hover:text-rose-600 px-2"><i class="fa-solid fa-trash-can"></i></button></td></tr>`; });
      let addOptions = `<option value="">+ Depuis la liste...</option><optgroup label="CSV">`;
      [...IMPORTED_CSV_CONTACTS].sort((a,b)=>a.name.localeCompare(b.name)).forEach((c, idx) => { addOptions += `<option value="csv_${idx}">${c.name}</option>`; }); addOptions += `</optgroup>`;
      if(appData.contacts.length>0) { addOptions += `<optgroup label="Evénement">`; appData.contacts.forEach(c => { addOptions += `<option value="evt_${c.id}">${c.name}</option>`; }); addOptions += `</optgroup>`; }
      return `
        <div class="flex justify-between items-center border-b pb-2 mb-3 pr-6"><h3 class="font-bold text-sm text-indigo-500"><i class="fa-solid fa-users"></i> Bénévoles Section</h3><div class="flex gap-2"><select onchange="addLocalContactFromList('${sec.id}', this.value); this.value='';" class="bg-white border rounded p-1 text-xs">${addOptions}</select><button onclick="addLocalContact('${sec.id}')" class="text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded border">+ Nouveau</button></div></div>
        <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead class="text-slate-500 bg-slate-50 uppercase text-[10px]"><tr><th class="p-2">Nom</th><th class="p-2">Emplacement</th><th class="p-2">Tél</th><th class="p-2"></th></tr></thead><tbody>${rows}</tbody></table></div>
      `;
    }
    function addLocalContactFromList(secId, val) { if (!val) return; const sec = appData.sections.find(x => x.id === secId); if(!sec) return; let name = "", phone = ""; if (val.startsWith('csv_')) { const c = IMPORTED_CSV_CONTACTS[parseInt(val.split('_')[1])]; if(c) { name = c.name; phone = c.phone || c.email || ""; } } else if (val.startsWith('evt_')) { const c = appData.contacts.find(x => x.id === val.replace('evt_', '')); if(c) { name = c.name; phone = c.phone || c.email || ""; } } if (name) { if(!sec.localContacts) sec.localContacts = []; sec.localContacts.push({ id: 'lc_' + Date.now(), name: name, emplacement: "", phone: phone }); saveData(); renderActiveSection(); } }
    function addLocalContact(sId) { const s = appData.sections.find(x => x.id === sId); if(s) { if(!s.localContacts) s.localContacts = []; s.localContacts.push({ id: 'lc_' + Date.now(), name: "Nouveau Bénévole", emplacement: "", phone: ""}); saveData(); renderActiveSection(); } }
    function updateLocalContactField(sId, cId, f, v) { const c = appData.sections.find(x => x.id === sId)?.localContacts?.find(x => x.id === cId); if(c) { c[f] = v; saveData(); } }
    function deleteLocalContact(sId, cId) { const s = appData.sections.find(x => x.id === sId); if(s && s.localContacts) { s.localContacts = s.localContacts.filter(x => x.id !== cId); removeContactFromAllTasksAndAgendas(cId); saveData(); renderActiveSection(); } }

    function generateImagesHtml(sec) { 
      let g = ''; (sec.images || []).forEach(img => g += `<div class="relative group aspect-video bg-slate-100 rounded-xl overflow-hidden"><img src="${img.dataUrl}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center gap-3"><button onclick="deleteImage('${sec.id}', '${img.id}')" class="bg-rose-500 text-white p-2 rounded-full"><i class="fa-solid fa-trash"></i></button></div></div>`); 
      return `
        <div class="border-b pb-2 mb-3 pr-6"><h3 class="font-bold text-sm text-blue-500"><i class="fa-solid fa-image"></i> Images</h3></div>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">${g}</div>
      `; 
    }
    function uploadImage(e, sId) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { const s = appData.sections.find(x => x.id === sId); if(s) { if(!s.images) s.images = []; s.images.push({id: 'img_'+Date.now(), name: f.name, dataUrl: ev.target.result}); saveData(); renderActiveSection(); }}; r.readAsDataURL(f); e.target.value = ''; }
    function deleteImage(sId, iId) { const s = appData.sections.find(x => x.id === sId); if(s && s.images) { s.images = s.images.filter(x => x.id !== iId); saveData(); renderActiveSection(); } }

    function generateAttachmentsHtml(sec) { 
      let l = ''; (sec.attachments || []).forEach(att => l += `<div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg text-xs"><span>${att.name}</span> <button onclick="deleteAttachment('${sec.id}', '${att.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`); 
      return `
        <div class="border-b pb-2 mb-3 pr-6"><h3 class="font-bold text-sm text-purple-500"><i class="fa-solid fa-paperclip"></i> Pièces Jointes</h3></div>
        <div class="grid gap-2">${l}</div>
      `; 
    }
    function uploadAttachment(e, sId) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { const s = appData.sections.find(x => x.id === sId); if(s) { if(!s.attachments) s.attachments = []; s.attachments.push({id: 'att_'+Date.now(), name: f.name, dataUrl: ev.target.result}); saveData(); renderActiveSection(); }}; r.readAsDataURL(f); e.target.value = ''; }
    function deleteAttachment(sId, aId) { const s = appData.sections.find(x => x.id === sId); if(s && s.attachments) { s.attachments = s.attachments.filter(x => x.id !== aId); saveData(); renderActiveSection(); } }

    function openRecapModal() {
      const select = document.getElementById('recap-contact-select');
      select.innerHTML = '<option value="">-- Choisir un contact --</option>';
      const allContacts = [];
      appData.contacts.forEach(c => allContacts.push({id: c.id, name: c.name, type: 'Répertoire', info: c.org || ''}));
      appData.sections.forEach(s => { if(s.localContacts) s.localContacts.forEach(c => allContacts.push({id: c.id, name: c.name, type: `Bénévole (${s.title})`, info: c.emplacement || ''})); });
      Array.from(new Map(allContacts.map(item => [item.id, item])).values()).sort((a, b) => a.name.localeCompare(b.name)).forEach(c => { select.innerHTML += `<option value="${c.id}">${c.name} - ${c.type}</option>`; });
      document.getElementById('recap-modal').classList.remove('hidden'); document.getElementById('recap-modal').classList.add('flex'); updateRecapView();
    }
    function closeRecapModal() { document.getElementById('recap-modal').classList.add('hidden'); document.getElementById('recap-modal').classList.remove('flex'); }
    function updateRecapView() {
      const contactId = document.getElementById('recap-contact-select').value;
      const contentArea = document.getElementById('recap-content-area');
      if (!contactId) { contentArea.innerHTML = '<div class="text-center text-slate-400 text-sm py-10 italic">Sélectionnez un contact pour voir ses missions.</div>'; return; }
      let html = ''; let missionCount = 0;
      appData.sections.forEach(sec => {
        const assignedTasks = (sec.tasks || []).filter(t => (t.resps || []).includes(contactId));
        const assignedTimeline = (sec.timeline || []).filter(t => t.resp === contactId);
        if (assignedTasks.length > 0 || assignedTimeline.length > 0) {
          html += `<div class="mb-4"><h4 class="font-bold text-sm text-slate-700 mb-2 border-b border-slate-200 pb-1">${sec.title}</h4>`;
          if (assignedTimeline.length > 0) { html += `<ul class="space-y-2 mb-3">`; assignedTimeline.forEach(t => { missionCount++; html += `<li class="flex items-center gap-3 bg-white p-2 rounded-lg border shadow-sm text-xs"><span class="font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">${t.time || '?'}</span><span class="font-medium">${t.activity || '?'}</span></li>`; }); html += `</ul>`; }
          if (assignedTasks.length > 0) { html += `<ul class="space-y-2">`; assignedTasks.forEach(t => { missionCount++; html += `<li class="flex items-center gap-2 bg-white p-3 rounded-lg border shadow-sm text-xs"><div class="flex-1 font-medium"><i class="fa-solid fa-list-check text-slate-400 mr-2"></i>${t.name || '?'}</div><div class="font-bold">${t.status || 'À faire'}</div></li>`; }); html += `</ul>`; }
          html += `</div>`;
        }
      });
      if (missionCount === 0) html = `<div class="text-center text-slate-400 text-sm py-10 italic">Aucune mission assignée.</div>`;
      contentArea.innerHTML = html;
    }

    window.onload = initAppData;
  </script>
</body>
</html>
